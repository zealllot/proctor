name: PRoctor
description: AI-driven PR test runner — analyze, plan, execute, fix, report.
inputs:
  anthropic-api-key:
    description: ANTHROPIC_API_KEY for Claude Code. Either this OR claude-code-oauth-token must be provided.
    required: false
  claude-code-oauth-token:
    description: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`. Use this when authenticating with a Claude.ai subscription instead of an Anthropic API key. Either this OR anthropic-api-key must be provided.
    required: false
  pr-number:
    description: PR number. Defaults to the event's PR number if available.
    required: false
runs:
  using: composite
  steps:
    - name: Verify Claude auth provided
      shell: bash
      run: |
        if [[ -z "${{ inputs.anthropic-api-key }}" && -z "${{ inputs.claude-code-oauth-token }}" ]]; then
          echo "ERR: PRoctor needs either 'anthropic-api-key' or 'claude-code-oauth-token' as an input. Neither was set." >&2
          echo "  - For an Anthropic API key, get one at https://console.anthropic.com" >&2
          echo "  - For a Claude.ai subscription, run 'claude setup-token' locally to generate an OAuth token." >&2
          exit 1
        fi

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve PR number
      id: resolve
      shell: bash
      run: |
        if [[ -n "${{ inputs.pr-number }}" ]]; then
          echo "pr=${{ inputs.pr-number }}" >> "$GITHUB_OUTPUT"
        elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
        elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
          echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
        else
          echo "no PR number" >&2; exit 1
        fi

    - name: Gate on issue_comment trigger
      if: github.event_name == 'issue_comment'
      shell: bash
      run: |
        if [[ "${{ github.event.comment.body }}" != *"/proctor run"* ]]; then
          echo "Comment is not a PRoctor run trigger; skipping."
          exit 78  # neutral exit (older runners) — newer ignore this
        fi
        # Require write access to the repo from the commenter
        gh api -H "Accept: application/vnd.github+json" \
          repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission \
          --jq '.permission' | grep -E '^(admin|write|maintain)$' \
          || { echo "commenter lacks write access"; exit 1; }
      env:
        GH_TOKEN: ${{ github.token }}

    # Cache the Claude Code install so subsequent runs skip the
    # ~10s curl-and-install step. Bump CACHE_VERSION below to force a
    # re-download when Claude Code ships an update we want to pick up.
    - name: Cache Claude Code install
      id: cache-claude
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/bin/claude
          ~/.local/share/anthropic-claude-code
          ~/.local/share/claude
        # GitHub evicts caches not accessed in 7 days, so a stable key is
        # fine. Bump the trailing "v1" if you need to force re-install.
        key: claude-code-${{ runner.os }}-${{ runner.arch }}-v1

    - name: Install Claude Code
      if: steps.cache-claude.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL https://claude.ai/install.sh | bash

    - name: Put Claude Code on PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run PRoctor (stage-by-stage)
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_ACTIONS: "true"
        PR: ${{ steps.resolve.outputs.pr }}
        REPO: ${{ github.repository }}
      run: |
        # Stage-by-stage orchestration: bash drives the pipeline; each
        # claude invocation handles ONE stage with a focused prompt.
        # Bash retries individual stages, validates JSON contracts via
        # schema.py, and aggregates structured logs in run-id directory.
        # This eliminates the multi-stage bailout vector we hit on
        # v0.1.4–v0.1.7 (model produced stage 1 output then exited).
        set -uo pipefail
        PLUGIN_DIR="${{ github.action_path }}/../plugins/proctor"
        PYTHONPATH="${{ github.action_path }}/.."
        export PYTHONPATH

        # Deterministic run-id (matches scripts/runlog.make_run_id format)
        PR_HEAD_SHA="$(gh pr view "$PR" -R "$REPO" --json headRefOid --jq '.headRefOid')"
        HASH="$(printf '%s' "${PR}|${PR_HEAD_SHA}|$(date -u +%Y%m%dT%H%M%SZ)" | shasum | cut -c1-8)"
        RUN_ID="pr${PR}-${PR_HEAD_SHA:0:7}-${HASH}"
        RUN_DIR=".proctor/runs/${RUN_ID}"
        mkdir -p "$RUN_DIR"
        echo "[proctor:run] start pr=$PR sha=$PR_HEAD_SHA run_id=$RUN_ID"

        # Pre-fetch PR data so the model doesn't have to (and to make
        # the analyze stage purely about classification).
        gh pr view "$PR" -R "$REPO" \
           --json number,headRefOid,baseRefOid,url,headRefName,baseRefName,title,body,author \
           > "$RUN_DIR/pr.json"
        gh pr diff "$PR" -R "$REPO" > "$RUN_DIR/diff.patch"

        # Run user-defined setup commands from .pr-test.yml (installs,
        # background servers, wait loops). Failures here are env-level
        # and abort the pipeline before any stage runs.
        if [[ -f .pr-test.yml ]]; then
          python3 -c "import yaml; print('\n'.join(yaml.safe_load(open('.pr-test.yml')).get('setup') or []))" > /tmp/proctor-setup-cmds.txt
          while IFS= read -r cmd; do
            [[ -z "$cmd" ]] && continue
            echo "[proctor:setup] running: $cmd"
            if ! bash -c "$cmd"; then
              echo "::error::Setup command failed: $cmd"
              echo "PROCTOR_PIPELINE_FAILED stage=setup reason=setup-command-failed" | tee -a /tmp/proctor-stdout.log
              exit 1
            fi
          done < /tmp/proctor-setup-cmds.txt
        fi

        run_stage() {
          local stage="$1" prompt="$2"
          local raw="$RUN_DIR/$stage.raw.json"
          local out="$RUN_DIR/$stage.stdout.log"
          echo "::group::Stage: $stage"
          echo "[proctor:$stage] start"
          # Up to 2 attempts per stage. Each attempt invokes claude with
          # --output-format json so we get usage stats alongside the
          # result. The model's text output (stripped from .result) is
          # written to <stage>.stdout.log for the existing empty-output
          # checks; per-stage usage is appended to usage.jsonl for the
          # report stage to aggregate.
          local attempt
          for attempt in 1 2; do
            if claude --print --output-format json --dangerously-skip-permissions \
                       --plugin-dir "$PLUGIN_DIR" \
                       "$prompt" > "$raw" 2>"$RUN_DIR/$stage.stderr.log"; then
              break
            fi
            if [[ $attempt -lt 2 ]]; then
              echo "::warning::Stage $stage attempt $attempt failed; retrying once"
              sleep 5
            fi
          done
          # Extract the model's text response into <stage>.stdout.log
          # for downstream consumers that grep it.
          if [[ -s "$raw" ]]; then
            python3 -c "import json; d=json.load(open('$raw')); print(d.get('result',''))" > "$out" 2>/dev/null || cp "$raw" "$out"
            # Append usage line for the cost summary
            python3 -c "import json,sys; d=json.load(open('$raw')); u=d.get('usage') or {}; cost=d.get('total_cost_usd') or 0; sys.stdout.write(json.dumps({'stage':'$stage','tokens_in':u.get('input_tokens',0)+u.get('cache_read_input_tokens',0),'tokens_out':u.get('output_tokens',0),'cost_usd':cost})+'\n')" >> "$RUN_DIR/usage.jsonl" 2>/dev/null || true
          else
            : > "$out"
          fi
          if ! grep -q . "$out" 2>/dev/null; then
            echo "::error::Stage $stage: empty output after retries"
            echo "PROCTOR_PIPELINE_FAILED stage=$stage reason=claude-error" \
              | tee -a /tmp/proctor-stdout.log
            echo "::endgroup::"
            return 1
          fi
          echo "[proctor:$stage] done"
          echo "::endgroup::"
        }

        validate_json() {
          local path="$1" validator="$2"
          python3 -c "import json, sys; sys.path.insert(0, '$PYTHONPATH'); from plugins.proctor.scripts.schema import $validator as v; v(json.load(open('$path'))); print('$path validated')"
        }

        # ---- Stage 1: analyze ----
        run_stage analyze "Apply the analyzing-pr-changes skill against PR #${PR} in ${REPO}.

        Inputs (already fetched, just read them):
        - $RUN_DIR/pr.json — PR metadata as JSON (includes title and body)
        - $RUN_DIR/diff.patch — unified diff

        Output: write a ChangeMap JSON to $RUN_DIR/change-map.json matching the contract documented in the skill: pr, pr_context, hunks, categories_present. Use only the categories: frontend, api, schema, infra, mobile, cli, docs (no e2e-flow — that's added by the planner). Use only risks: low, medium, high.

        IMPORTANT: populate pr_context per the skill's procedure step 2 — extract title, body, links (URLs in the body, especially Slack/Jira/Linear/Notion/Confluence/Figma), and requirement_hints (acceptance-criteria style snippets). Do NOT follow the URLs.

        Do not output anything but a single short status line confirming the file is written. Do NOT include the full JSON in your reply." || exit 1
        validate_json "$RUN_DIR/change-map.json" validate_change_map || exit 1

        # ---- Stage 2: plan ----
        run_stage plan "Apply the planning-pr-tests skill.

        Inputs:
        - $RUN_DIR/change-map.json — including pr_context (title, body, links, requirement_hints)
        - .pr-test.yml at the repo root (read it for setup, base_url, test_focus, per_test_timeout_seconds, auto_fix)

        Output: write a TestPlan JSON to $RUN_DIR/test-plan.json matching the contract. Honor the tool selection priority documented in the skill (lint-only first, then bash with existing tests, then curl, then chrome-devtools). Only plan curl / chrome-devtools items if .pr-test.yml has setup commands that bring up the relevant server.

        IMPORTANT — read pr_context. The PR description often contains the actual acceptance criteria (concrete numbers, behaviors, references to Slack/Jira/Linear tickets). When pr_context.body or pr_context.requirement_hints contain a concrete claim, generate test items that verify that exact claim, phrased in the body's wording. When body links to an off-PR doc without quoting it, write 'Per <ticket-id>: ...' in the item's how: field and mark risk: medium. If body and diff disagree, plan items for both.

        Reply with only a short status line." || exit 1
        validate_json "$RUN_DIR/test-plan.json" validate_test_plan || exit 1

        # ---- Stage 3: execute ----
        # Per-item bash dispatch. One claude --print per test item keeps each
        # invocation's context small enough that heavy chrome-devtools items
        # don't bloat the parent and cause the bail-with-empty-output failure
        # we hit on v0.1.17 with PRs spanning 5+ chrome-devtools items.
        mkdir -p "$RUN_DIR/screenshots" "$RUN_DIR/logs" "$RUN_DIR/results"
        echo "::group::Stage: execute"
        echo "[proctor:execute] start"

        # Force-push guard: if PR head moved while we were planning, bail.
        CURRENT_HEAD="$(gh pr view "$PR" -R "$REPO" --json headRefOid --jq '.headRefOid')"
        if [[ "$CURRENT_HEAD" != "$PR_HEAD_SHA" ]]; then
          echo "::error::PR head changed during run ($PR_HEAD_SHA -> $CURRENT_HEAD); aborting execute"
          echo "PROCTOR_PIPELINE_FAILED stage=execute reason=force-push" | tee -a /tmp/proctor-stdout.log
          exit 1
        fi

        # Read .pr-test.yml for base_url / timeout
        BASE_URL=$(python3 -c "import yaml; cfg=yaml.safe_load(open('.pr-test.yml')) or {}; print(cfg.get('base_url','http://127.0.0.1:5173'))" 2>/dev/null || echo "http://127.0.0.1:5173")
        ITEM_TIMEOUT=$(python3 -c "import yaml; cfg=yaml.safe_load(open('.pr-test.yml')) or {}; print(cfg.get('per_test_timeout_seconds', 60))" 2>/dev/null || echo 60)

        # Dispatch each item to a fresh claude invocation, in parallel
        # (capped concurrency). Per-item retry handles transient claude
        # failures without re-running successful items. Concurrency cap
        # protects against API rate limits and chrome-devtools port
        # collisions.
        ITEM_COUNT=$(python3 -c "import json; print(len(json.load(open('$RUN_DIR/test-plan.json'))['items']))")
        # Override via PROCTOR_EXECUTE_CONCURRENCY if a consumer wants
        # different parallelism. 3 is conservative and validated.
        CONCURRENCY="${PROCTOR_EXECUTE_CONCURRENCY:-3}"
        echo "[proctor:execute] dispatching $ITEM_COUNT items in parallel (concurrency=$CONCURRENCY), base_url=$BASE_URL, timeout=${ITEM_TIMEOUT}s"
        # shellcheck disable=SC2046
        ITEM_IDS=$(python3 -c "import json; [print(i['id']) for i in json.load(open('$RUN_DIR/test-plan.json'))['items']]")

        run_item() {
          local ITEM_ID="$1"
          local ITEM_JSON
          ITEM_JSON=$(python3 -c "import json; print(json.dumps([i for i in json.load(open('$RUN_DIR/test-plan.json'))['items'] if i['id']=='$ITEM_ID'][0]))")
          local ITEM_PROMPT="Run the pr-test-executor subagent against this single test item and write its result to $RUN_DIR/results/${ITEM_ID}.json (one JSON object). Return only a short status line.

        Item:
        $ITEM_JSON

        Environment:
        - base_url: $BASE_URL
        - per_test_timeout_seconds: $ITEM_TIMEOUT
        - logs_dir: $RUN_DIR  (the executor's logs_ref should be $RUN_DIR/logs/${ITEM_ID}.log and screenshot_ref, when chrome-devtools is used, must be $RUN_DIR/screenshots/${ITEM_ID}.png)

        The result JSON MUST include id, status (pass|fail|skipped), evidence (1-2 sentences citing actual observed values). It SHOULD include command, output_excerpt (4 KB max), logs_ref. For chrome-devtools items, screenshot_ref is REQUIRED — capture via take_screenshot before returning. Also include screenshot_focus: a one-sentence description of WHICH region of the screenshot validates the evidence (or 'evidence not visible in screenshot — verified via DOM only' when the assertion is on document.title or other non-visible element)."

          local attempt
          for attempt in 1 2; do
            if claude --print --output-format json --dangerously-skip-permissions \
                       --plugin-dir "$PLUGIN_DIR" \
                       "$ITEM_PROMPT" > "$RUN_DIR/logs/${ITEM_ID}.exec.log" 2>&1; then
              break
            fi
            echo "::warning::item $ITEM_ID attempt $attempt failed; retrying once"
            sleep 5
          done
          # Capture per-item usage from the JSON wrapper
          if python3 -c "import json,sys; d=json.load(open('$RUN_DIR/logs/${ITEM_ID}.exec.log')); u=d.get('usage') or {}; cost=d.get('total_cost_usd') or 0; sys.stdout.write(json.dumps({'id':'$ITEM_ID','stage':'execute','tokens_in':u.get('input_tokens',0)+u.get('cache_read_input_tokens',0),'tokens_out':u.get('output_tokens',0),'cost_usd':cost})+'\n')" >> "$RUN_DIR/usage.jsonl" 2>/dev/null; then
            :
          fi
          # Synthesize a fail entry if the executor never wrote a result file
          if [[ ! -s "$RUN_DIR/results/${ITEM_ID}.json" ]]; then
            echo "::warning::item $ITEM_ID produced no result file — recording as fail/error"
            cat > "$RUN_DIR/results/${ITEM_ID}.json" <<JSON
        {"id":"$ITEM_ID","status":"fail","reason":"error","evidence":"Executor returned no result for this item after retries; see logs/${ITEM_ID}.exec.log."}
        JSON
          fi
        }

        # Concurrency-limited parallel dispatch. bash 4.3+ provides 'wait -n'.
        running=0
        for ITEM_ID in $ITEM_IDS; do
          if (( running >= CONCURRENCY )); then
            wait -n
            running=$((running - 1))
          fi
          ( run_item "$ITEM_ID" ) &
          running=$((running + 1))
        done
        wait

        # Aggregate per-item results into one TestResults file.
        python3 - <<PY
        import json, os
        run_dir = "$RUN_DIR"
        plan = json.load(open(os.path.join(run_dir, "test-plan.json")))
        items = []
        for it in plan["items"]:
            p = os.path.join(run_dir, "results", f"{it['id']}.json")
            try:
                items.append(json.load(open(p)))
            except Exception as e:
                items.append({"id": it["id"], "status": "fail", "reason": "error",
                              "evidence": f"Result file unreadable: {e}"})
        summary = {"total": len(items), "pass": 0, "fail": 0, "skipped": 0}
        for it in items:
            summary[it.get("status", "fail")] = summary.get(it.get("status", "fail"), 0) + 1
        json.dump({"items": items, "summary": summary},
                  open(os.path.join(run_dir, "test-results.json"), "w"),
                  indent=2)
        print(f"[proctor:execute] aggregated: pass={summary['pass']} fail={summary['fail']} skipped={summary['skipped']}")
        PY
        echo "[proctor:execute] done"
        echo "::endgroup::"
        validate_json "$RUN_DIR/test-results.json" validate_test_results || exit 1

        # Decide whether stage 4 should run
        FAIL_COUNT=$(python3 -c "import json; print(json.load(open('$RUN_DIR/test-results.json'))['summary']['fail'])")
        AUTO_FIX=$(python3 -c "import os, yaml; cfg = yaml.safe_load(open('.pr-test.yml')) if os.path.exists('.pr-test.yml') else {}; print('true' if (cfg or {}).get('auto_fix', True) else 'false')")
        if [[ "$FAIL_COUNT" -gt 0 && "$AUTO_FIX" == "true" ]]; then
          # Tolerant: if the fixer fails (timeout, can't produce a patch,
          # or returns non-zero for any reason), don't abort the pipeline
          # — we still want stage 5 to post a 'needs human review' report.
          # The report skill reads fix-pr-ref.json; null means no fix PR.
          if ! run_stage fix "Apply the fixing-test-failures skill.

        Inputs:
        - $RUN_DIR/test-results.json — has $FAIL_COUNT failed items
        - $RUN_DIR/change-map.json — hunks that the failed tests probed
        - PR head ref: $(jq -r .headRefName < "$RUN_DIR/pr.json")

        Output: write FixPRRef JSON to $RUN_DIR/fix-pr-ref.json (or 'null'). Open the fix PR via gh and capture its number/url/branch in the JSON. Reply with only a short status line."; then
            echo "::warning::Fix stage failed; downgrading to 'needs human review' and continuing to report"
            echo "null" > "$RUN_DIR/fix-pr-ref.json"
          fi
          # Defensive: if the fixer returned 0 but didn't write a valid
          # FixPRRef, also fall back to null so stage 5 can render.
          if ! validate_json "$RUN_DIR/fix-pr-ref.json" validate_fix_pr_ref 2>/dev/null; then
            echo "::warning::fix-pr-ref.json missing or invalid; treating as null"
            echo "null" > "$RUN_DIR/fix-pr-ref.json"
          fi
        else
          echo "[proctor:fix] skipped fail=$FAIL_COUNT auto_fix=$AUTO_FIX"
          echo "null" > "$RUN_DIR/fix-pr-ref.json"
        fi
        validate_json "$RUN_DIR/fix-pr-ref.json" validate_fix_pr_ref || exit 1

        # ---- Push screenshots to a dedicated branch for inline embedding ----
        # GitHub PR comments can't render images from Action artifacts, so we
        # push any screenshot PNGs to an orphan branch named `proctor-screenshots`
        # under the run-id directory and reference them by raw.githubusercontent
        # URL from the report. The branch is opaque infra: each run adds a
        # subdirectory; older runs accumulate but are never modified.
        SCREENSHOT_URL_BASE=""
        if [[ -d "$RUN_DIR/screenshots" ]] && ls "$RUN_DIR/screenshots"/*.png >/dev/null 2>&1; then
          ss_count=$(ls "$RUN_DIR/screenshots"/*.png | wc -l | tr -d ' ')
          echo "[proctor:screenshots] pushing $ss_count PNG(s) to proctor-screenshots branch"
          ss_dir="$(mktemp -d)"
          ss_url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # Try clone first (handles existing branch + isolated history).
          # Fall back to git init if the branch doesn't exist yet.
          if git clone --depth 1 --branch proctor-screenshots --quiet "$ss_url" "$ss_dir" 2>/dev/null; then
            echo "(cloned existing proctor-screenshots branch)"
          else
            echo "(no existing proctor-screenshots branch — initializing)"
            rm -rf "$ss_dir"
            ss_dir="$(mktemp -d)"
            git -C "$ss_dir" init -q -b proctor-screenshots
            git -C "$ss_dir" config user.name "github-actions[bot]"
            git -C "$ss_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            : > "$ss_dir/.proctor-screenshots-marker"
            git -C "$ss_dir" add .proctor-screenshots-marker
            git -C "$ss_dir" commit -q -m "init proctor-screenshots branch"
          fi
          # Always set identity for the new commit (clone case doesn't carry it
          # over from the workflow runner).
          git -C "$ss_dir" config user.name "github-actions[bot]"
          git -C "$ss_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p "$ss_dir/$RUN_ID"
          cp "$RUN_DIR"/screenshots/*.png "$ss_dir/$RUN_ID/"
          git -C "$ss_dir" add "$RUN_ID"
          git -C "$ss_dir" commit -q -m "screenshots: $RUN_ID"

          # Force-with-lease handles parallel runs; the screenshots branch is
          # opaque infra and history-rewrite collisions are acceptable.
          push_ok=0
          for attempt in 1 2; do
            if git -C "$ss_dir" push --quiet --force "$ss_url" proctor-screenshots; then
              push_ok=1; break
            fi
            echo "::warning::screenshots push attempt $attempt failed; retrying"
            sleep 2
          done
          if [[ "$push_ok" -eq 1 ]]; then
            SCREENSHOT_URL_BASE="${GITHUB_SERVER_URL}/${REPO}/raw/proctor-screenshots/${RUN_ID}/"
            echo "[proctor:screenshots] published at $SCREENSHOT_URL_BASE"
          else
            echo "::warning::Failed to push screenshots branch after retries; falling back to artifact-only references"
          fi
          rm -rf "$ss_dir"
        fi
        export SCREENSHOT_URL_BASE

        # ---- Aggregate cost from usage.jsonl ----
        # Sum tokens + cost across all stages and per-item executions so
        # the report can show consumers what each PR run cost.
        if [[ -s "$RUN_DIR/usage.jsonl" ]]; then
          PROCTOR_USAGE_SUMMARY=$(python3 -c "
        import json
        tin = tout = 0
        cost = 0.0
        for ln in open('$RUN_DIR/usage.jsonl'):
            try:
                d = json.loads(ln)
                tin  += int(d.get('tokens_in')  or 0)
                tout += int(d.get('tokens_out') or 0)
                cost += float(d.get('cost_usd') or 0)
            except Exception:
                pass
        print(f'tokens_in={tin} tokens_out={tout} cost_usd={cost:.4f}')
          ")
          echo "[proctor:usage] $PROCTOR_USAGE_SUMMARY"
        else
          PROCTOR_USAGE_SUMMARY=""
        fi
        export PROCTOR_USAGE_SUMMARY

        # ---- Stage 5: report ----
        # Pass through env so the report skill can build Action / artifact URLs
        export RUN_ID
        export GITHUB_RUN_ID="${{ github.run_id }}"
        export GITHUB_SERVER_URL="${{ github.server_url }}"
        run_stage report "Apply the reporting-pr-test-results skill.

        Inputs (read these files):
        - $RUN_DIR/test-results.json
        - $RUN_DIR/fix-pr-ref.json (may be null)
        - $RUN_DIR/change-map.json

        Environment values for cross-linking:
        - PR=$PR, REPO=$REPO, RUN_ID=$RUN_ID
        - GITHUB_RUN_ID=$GITHUB_RUN_ID, GITHUB_SERVER_URL=$GITHUB_SERVER_URL
        - SCREENSHOT_URL_BASE=$SCREENSHOT_URL_BASE  (empty if no screenshots were captured; else a public raw URL prefix like https://github.com/owner/repo/raw/proctor-screenshots/<run-id>/)
        - PROCTOR_USAGE_SUMMARY=$PROCTOR_USAGE_SUMMARY  (e.g. 'tokens_in=45000 tokens_out=8000 cost_usd=0.1234'; render in the header as a Cost line per the skill procedure)
        - Action run URL: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID
        - Artifact URL: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID#artifacts

        Render per the skill procedure: header with Action + artifact links, then a per-item <details> section for EACH item with What it did, Evidence, Command, Output, Screenshot, Logs. ALWAYS include a Screenshot subsection for items that have screenshot_ref — when SCREENSHOT_URL_BASE is non-empty, embed the image inline as a markdown image whose URL is SCREENSHOT_URL_BASE concatenated with the basename of screenshot_ref; when SCREENSHOT_URL_BASE is empty, fall back to a path-in-artifact reference. Fail items must default <details open>. Post the rendered comment via:
          gh pr comment $PR -R $REPO --body-file <path-to-rendered>
        Confirm posting succeeded by reading the comment back via 'gh pr view $PR -R $REPO --json comments'.

        Save the rendered markdown to $RUN_DIR/report.md as well so the artifact has it.

        Reply with only a short status line." || exit 1

        # All stages done — emit the COMPLETE marker
        echo "PROCTOR_PIPELINE_COMPLETE pr=$PR run_id=$RUN_ID" \
          | tee -a /tmp/proctor-stdout.log

    - name: Verify pipeline completed
      shell: bash
      run: |
        if grep -q "PROCTOR_PIPELINE_COMPLETE" /tmp/proctor-stdout.log 2>/dev/null; then
          echo "Pipeline marker found — all stages ran."
          exit 0
        fi
        echo "::error::PRoctor pipeline did not reach the COMPLETE marker." >&2
        if grep -q "PROCTOR_PIPELINE_FAILED" /tmp/proctor-stdout.log 2>/dev/null; then
          grep "PROCTOR_PIPELINE_FAILED" /tmp/proctor-stdout.log >&2
        fi
        exit 1

    - name: Sanitize run-id paths for artifact upload
      if: always()
      shell: bash
      run: |
        # GitHub artifacts reject : " < > | * ? \r \n in any path component.
        # The model is supposed to call runlog.make_run_id (which never
        # produces invalid chars), but if it improvises an ISO timestamp
        # in the run-id we'd lose the artifact. Rename defensively here.
        if [[ ! -d .proctor/runs ]]; then
          echo "No .proctor/runs to sanitize."
          exit 0
        fi
        cd .proctor/runs
        for d in */; do
          d="${d%/}"
          clean="$(echo -n "$d" | tr ':"<>|*?\r\n' '_')"
          if [[ "$d" != "$clean" ]]; then
            echo "Sanitizing run-id: $d -> $clean"
            mv -- "$d" "$clean"
          fi
        done

    - name: Upload run artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: proctor-run-${{ steps.resolve.outputs.pr }}
        path: .proctor/runs/
        if-no-files-found: warn
