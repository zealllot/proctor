name: PRoctor
description: AI-driven PR test runner — analyze, plan, execute, fix, report.
inputs:
  anthropic-api-key:
    description: ANTHROPIC_API_KEY for Claude Code. Either this OR claude-code-oauth-token must be provided.
    required: false
  claude-code-oauth-token:
    description: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`. Use this when authenticating with a Claude.ai subscription instead of an Anthropic API key. Either this OR anthropic-api-key must be provided.
    required: false
  pr-number:
    description: PR number. Defaults to the event's PR number if available.
    required: false
runs:
  using: composite
  steps:
    # Anti-loop: PRoctor's auto-fix opens PRs named fix-<PR#>-<sha>.
    # If a workflow on that fix PR also triggers PRoctor, we'd recurse
    # (fix → analyzed → maybe fails → opens fix-of-fix → analyzed → ...).
    # Stop early: fix-* branches and PRs authored by github-actions[bot]
    # are PRoctor's own outputs, not subject matter for PRoctor itself.
    - name: Anti-loop guard
      id: antiloop
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "pull_request_target" ]]; then
          BR="${{ github.event.pull_request.head.ref }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"
          if [[ "$BR" == fix-*-* ]] || [[ "$AUTHOR" == "github-actions[bot]" ]] || [[ "$AUTHOR" == proctor-* ]]; then
            echo "::notice::Skipping PRoctor on fix PR (branch=$BR, author=$AUTHOR) to avoid loops."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Verify Claude auth provided
      if: steps.antiloop.outputs.skip != 'true'
      shell: bash
      run: |
        if [[ -z "${{ inputs.anthropic-api-key }}" && -z "${{ inputs.claude-code-oauth-token }}" ]]; then
          echo "ERR: PRoctor needs either 'anthropic-api-key' or 'claude-code-oauth-token' as an input. Neither was set." >&2
          echo "  - For an Anthropic API key, get one at https://console.anthropic.com" >&2
          echo "  - For a Claude.ai subscription, run 'claude setup-token' locally to generate an OAuth token." >&2
          exit 1
        fi

    - name: Checkout
      if: steps.antiloop.outputs.skip != 'true'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve PR number
      if: steps.antiloop.outputs.skip != 'true'
      id: resolve
      shell: bash
      run: |
        if [[ -n "${{ inputs.pr-number }}" ]]; then
          echo "pr=${{ inputs.pr-number }}" >> "$GITHUB_OUTPUT"
        elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
        elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
          echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
        else
          echo "no PR number" >&2; exit 1
        fi

    - name: Gate on issue_comment trigger
      id: comment-gate
      if: github.event_name == 'issue_comment'
      shell: bash
      run: |
        BODY=${{ toJSON(github.event.comment.body) }}
        # Trigger formats:
        #   /proctor run                   → resume after require_approval
        #   /proctor rerun [t-001 t-002]   → re-execute selected items only
        #                                    (no IDs = re-run all items)
        if [[ "$BODY" == *"/proctor rerun"* ]]; then
          MODE=rerun
          # Extract IDs after '/proctor rerun' on its line; tolerate trailing words
          IDS=$(echo "$BODY" | grep -oE '/proctor rerun[^\\n]*' | head -1 | sed 's|^/proctor rerun||' | tr -s ' \t' '\n' | grep -E '^t-[0-9]+$' | tr '\n' ' ')
          echo "mode=rerun" >> "$GITHUB_OUTPUT"
          echo "rerun_ids=$IDS" >> "$GITHUB_OUTPUT"
        elif [[ "$BODY" == *"/proctor run"* ]]; then
          MODE=run
          echo "mode=run" >> "$GITHUB_OUTPUT"
        else
          echo "Comment is not a PRoctor trigger; skipping."
          exit 78  # neutral exit
        fi
        # Require write access on the commenter
        gh api -H "Accept: application/vnd.github+json" \
          repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission \
          --jq '.permission' | grep -E '^(admin|write|maintain)$' \
          || { echo "commenter lacks write access"; exit 1; }
        echo "::notice::Trigger: $MODE${IDS:+ (IDs: $IDS)}"
      env:
        GH_TOKEN: ${{ github.token }}

    # Cache the Claude Code install so subsequent runs skip the
    # ~10s curl-and-install step. Bump CACHE_VERSION below to force a
    # re-download when Claude Code ships an update we want to pick up.
    - name: Cache Claude Code install
      if: steps.antiloop.outputs.skip != 'true'
      id: cache-claude
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/bin/claude
          ~/.local/share/anthropic-claude-code
          ~/.local/share/claude
        # GitHub evicts caches not accessed in 7 days, so a stable key is
        # fine. Bump the trailing "v1" if you need to force re-install.
        key: claude-code-${{ runner.os }}-${{ runner.arch }}-v1

    - name: Install Claude Code
      if: steps.cache-claude.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL https://claude.ai/install.sh | bash

    - name: Put Claude Code on PATH
      if: steps.antiloop.outputs.skip != 'true'
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run PRoctor (stage-by-stage)
      if: steps.antiloop.outputs.skip != 'true'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_ACTIONS: "true"
        PR: ${{ steps.resolve.outputs.pr }}
        REPO: ${{ github.repository }}
        PROCTOR_MODE: ${{ steps.comment-gate.outputs.mode || 'run' }}
        PROCTOR_RERUN_IDS: ${{ steps.comment-gate.outputs.rerun_ids || '' }}
      run: |
        # Stage-by-stage orchestration: bash drives the pipeline; each
        # claude invocation handles ONE stage with a focused prompt.
        # Bash retries individual stages, validates JSON contracts via
        # schema.py, and aggregates structured logs in run-id directory.
        # This eliminates the multi-stage bailout vector we hit on
        # v0.1.4–v0.1.7 (model produced stage 1 output then exited).
        set -uo pipefail
        PLUGIN_DIR="${{ github.action_path }}/../plugins/proctor"
        PYTHONPATH="${{ github.action_path }}/.."
        export PYTHONPATH

        # Deterministic run-id (matches scripts/runlog.make_run_id format)
        PR_HEAD_SHA="$(gh pr view "$PR" -R "$REPO" --json headRefOid --jq '.headRefOid')"
        HASH="$(printf '%s' "${PR}|${PR_HEAD_SHA}|$(date -u +%Y%m%dT%H%M%SZ)" | shasum | cut -c1-8)"
        RUN_ID="pr${PR}-${PR_HEAD_SHA:0:7}-${HASH}"
        RUN_DIR=".proctor/runs/${RUN_ID}"
        mkdir -p "$RUN_DIR"
        echo "[proctor:run] start pr=$PR sha=$PR_HEAD_SHA run_id=$RUN_ID mode=$PROCTOR_MODE${PROCTOR_RERUN_IDS:+ rerun_ids=$PROCTOR_RERUN_IDS}"

        # Rerun mode: skip analyze + plan, hydrate them from the most recent
        # successful artifact for this PR, filter the plan to the requested
        # IDs (or use all), and let the rest of the pipeline run normally.
        if [[ "$PROCTOR_MODE" == "rerun" ]]; then
          echo "::group::Rerun: hydrating from prior run artifact"
          mkdir -p "$RUN_DIR/results"
          PREV_RUN_ID=$(gh run list -R "$REPO" --workflow "$(basename ${{ github.workflow_ref }} 2>/dev/null || echo proctor.yml)" --limit 30 --json databaseId,conclusion,createdAt,event \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and (.event==\"pull_request\" or .event==\"pull_request_target\"))][0].databaseId" 2>/dev/null || echo "")
          # Fallback: look up the last run on this branch
          if [[ -z "$PREV_RUN_ID" || "$PREV_RUN_ID" == "null" ]]; then
            HEAD_REF="$(gh pr view "$PR" -R "$REPO" --json headRefName --jq '.headRefName')"
            PREV_RUN_ID=$(gh run list -R "$REPO" --branch "$HEAD_REF" --limit 5 --json databaseId,conclusion --jq "[.[] | select(.databaseId != ${{ github.run_id }})][0].databaseId" 2>/dev/null || echo "")
          fi
          if [[ -z "$PREV_RUN_ID" || "$PREV_RUN_ID" == "null" ]]; then
            echo "::error::No previous run artifact found to rerun from."
            echo "PROCTOR_PIPELINE_FAILED stage=rerun-init reason=no-previous-run" | tee -a /tmp/proctor-stdout.log
            exit 1
          fi
          rm -rf /tmp/proctor-prev
          mkdir -p /tmp/proctor-prev
          if ! gh run download "$PREV_RUN_ID" -R "$REPO" --name "proctor-run-$PR" --dir /tmp/proctor-prev 2>/dev/null; then
            echo "::error::Could not download artifact 'proctor-run-$PR' from run $PREV_RUN_ID."
            echo "PROCTOR_PIPELINE_FAILED stage=rerun-init reason=artifact-missing" | tee -a /tmp/proctor-stdout.log
            exit 1
          fi
          PREV_DIR=$(ls -d /tmp/proctor-prev/*/ 2>/dev/null | head -1)
          if [[ -z "$PREV_DIR" ]]; then
            echo "::error::Artifact extracted to no directory; aborting rerun."
            exit 1
          fi
          echo "[proctor:rerun] hydrating from previous run $PREV_RUN_ID at $PREV_DIR"
          for f in pr.json diff.patch change-map.json test-plan.json test-results.json fix-pr-ref.json; do
            [[ -f "$PREV_DIR/$f" ]] && cp "$PREV_DIR/$f" "$RUN_DIR/$f"
          done
          # Carry over previous per-item logs and screenshots so the merged
          # report still references unchanged items' evidence.
          [[ -d "$PREV_DIR/logs" ]] && cp -r "$PREV_DIR/logs" "$RUN_DIR/logs"
          [[ -d "$PREV_DIR/screenshots" ]] && cp -r "$PREV_DIR/screenshots" "$RUN_DIR/screenshots"
          [[ -d "$PREV_DIR/results" ]] && cp -r "$PREV_DIR/results" "$RUN_DIR/results"
          # Filter the plan: if rerun_ids is empty, run all items;
          # otherwise keep only the listed IDs.
          if [[ -n "$PROCTOR_RERUN_IDS" ]]; then
            python3 - <<PY
        import json, os
        ids = set("$PROCTOR_RERUN_IDS".split())
        plan = json.load(open(os.path.join("$RUN_DIR","test-plan.json")))
        kept = [i for i in plan["items"] if i["id"] in ids]
        plan["items"] = kept
        json.dump(plan, open(os.path.join("$RUN_DIR","test-plan.json"),"w"), indent=2)
        # Drop the PRIOR result entries for re-run IDs so execute writes fresh ones
        rdir = os.path.join("$RUN_DIR","results")
        for rid in ids:
            p = os.path.join(rdir, f"{rid}.json")
            if os.path.exists(p):
                os.remove(p)
        print(f"[proctor:rerun] re-executing {len(kept)} items: {sorted(i['id'] for i in kept)}")
        PY
          else
            # No specific IDs → re-execute all items
            python3 - <<PY
        import json, os, glob
        rdir = os.path.join("$RUN_DIR","results")
        for p in glob.glob(os.path.join(rdir, "*.json")):
            os.remove(p)
        plan = json.load(open(os.path.join("$RUN_DIR","test-plan.json")))
        print(f"[proctor:rerun] re-executing all {len(plan['items'])} items")
        PY
          fi
          echo "::endgroup::"
          # Force-push detection still applies in rerun mode (PR head SHA
          # may have moved since the previous plan was made).
        fi

        # Pre-fetch PR data so the model doesn't have to (and to make
        # the analyze stage purely about classification).
        gh pr view "$PR" -R "$REPO" \
           --json number,headRefOid,baseRefOid,url,headRefName,baseRefName,title,body,author \
           > "$RUN_DIR/pr.json"
        gh pr diff "$PR" -R "$REPO" > "$RUN_DIR/diff.patch"

        # ---- Visual regression baseline capture (optional) ----
        # When .pr-test.yml has 'visual_regression: true', check out the
        # PR base ref into a worktree, run setup there, screenshot the
        # base_url main page → baseline.png, then tear down and proceed
        # with the normal pipeline on PR head. After the head pipeline,
        # capture head.png and `compare` produces diff.png. All three
        # render in the report.
        VISUAL_REG=false
        if [[ -f .pr-test.yml ]]; then
          VISUAL_REG=$(python3 -c "import yaml; cfg=yaml.safe_load(open('.pr-test.yml')) or {}; print('true' if cfg.get('visual_regression', False) else 'false')" 2>/dev/null || echo false)
        fi
        if [[ "$VISUAL_REG" == "true" && "$PROCTOR_MODE" != "rerun" ]]; then
          echo "::group::Visual regression: capture baseline at PR base ref"
          mkdir -p "$RUN_DIR/visual"
          BASE_REF=$(jq -r '.baseRefName' "$RUN_DIR/pr.json")
          BASE_SHA=$(jq -r '.baseRefOid' "$RUN_DIR/pr.json")
          BASE_URL=$(python3 -c "import yaml; cfg=yaml.safe_load(open('.pr-test.yml')) or {}; print(cfg.get('base_url','http://127.0.0.1:5173'))" 2>/dev/null || echo "http://127.0.0.1:5173")
          # Default teardown — kill common dev-server names and wait. Override
          # via .pr-test.yml 'teardown:' if your stack needs different cleanup.
          TEARDOWN_CMDS=$(python3 -c "
        import yaml
        cfg = yaml.safe_load(open('.pr-test.yml')) or {}
        td = cfg.get('teardown') or [
          \"pkill -f 'pnpm dev' || true\",
          \"pkill -f '/tmp/' || true\",
          \"pkill -f 'go run' || true\",
          \"pkill -f 'vite' || true\",
          \"sleep 3\",
        ]
        print('\n'.join(td))
        ")
          # Worktree the base ref next to repo
          BASELINE_WT="$(mktemp -d)/baseline-wt"
          if git worktree add --detach "$BASELINE_WT" "$BASE_SHA" 2>&1 | tee /tmp/proctor-baseline-wt.log; then
            pushd "$BASELINE_WT" > /dev/null
            # Run setup in baseline worktree (inherit PR head's .pr-test.yml
            # — the base ref might not have one if the PR added it)
            cp -f "${GITHUB_WORKSPACE}/.pr-test.yml" .pr-test.yml 2>/dev/null || true
            BASELINE_OK=true
            while IFS= read -r cmd; do
              [[ -z "$cmd" ]] && continue
              echo "[proctor:baseline-setup] $cmd"
              if ! bash -c "$cmd"; then
                echo "::warning::Baseline setup command failed: $cmd — skipping baseline capture"
                BASELINE_OK=false
                break
              fi
            done < /tmp/proctor-setup-cmds.txt
            if [[ "$BASELINE_OK" == "true" ]]; then
              echo "[proctor:baseline] capturing $BASE_URL"
              # Use chromium-browser if available; runners typically have it
              # via Playwright / setup-chrome / preinstalled
              CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || command -v chrome || echo '')"
              if [[ -n "$CHROME_BIN" ]]; then
                "$CHROME_BIN" --headless --disable-gpu --no-sandbox \
                              --hide-scrollbars --window-size=1280,800 \
                              --screenshot="$RUN_DIR/visual/baseline.png" \
                              "$BASE_URL" > /dev/null 2>&1 || true
                if [[ -s "$RUN_DIR/visual/baseline.png" ]]; then
                  echo "[proctor:baseline] captured $(wc -c < "$RUN_DIR/visual/baseline.png") bytes"
                else
                  echo "::warning::Baseline screenshot empty; visual regression will be skipped"
                  rm -f "$RUN_DIR/visual/baseline.png"
                fi
              else
                echo "::warning::No chromium-browser on runner; visual regression skipped"
              fi
            fi
            popd > /dev/null
            git worktree remove --force "$BASELINE_WT" 2>/dev/null || true
          fi
          # Teardown baseline servers regardless
          while IFS= read -r cmd; do
            [[ -z "$cmd" ]] && continue
            echo "[proctor:baseline-teardown] $cmd"
            bash -c "$cmd" 2>&1 | head -5 || true
          done <<< "$TEARDOWN_CMDS"
          echo "::endgroup::"
        fi

        # Run user-defined setup commands from .pr-test.yml (installs,
        # background servers, wait loops). Failures here are env-level
        # and abort the pipeline before any stage runs.
        if [[ -f .pr-test.yml ]]; then
          python3 -c "import yaml; print('\n'.join(yaml.safe_load(open('.pr-test.yml')).get('setup') or []))" > /tmp/proctor-setup-cmds.txt
          while IFS= read -r cmd; do
            [[ -z "$cmd" ]] && continue
            echo "[proctor:setup] running: $cmd"
            if ! bash -c "$cmd"; then
              echo "::error::Setup command failed: $cmd"
              echo "PROCTOR_PIPELINE_FAILED stage=setup reason=setup-command-failed" | tee -a /tmp/proctor-stdout.log
              exit 1
            fi
          done < /tmp/proctor-setup-cmds.txt
        fi

        run_stage() {
          local stage="$1" prompt="$2"
          local raw="$RUN_DIR/$stage.raw.json"
          local out="$RUN_DIR/$stage.stdout.log"
          echo "::group::Stage: $stage"
          echo "[proctor:$stage] start"
          # Up to 2 attempts per stage. Each attempt invokes claude with
          # --output-format json so we get usage stats alongside the
          # result. The model's text output (stripped from .result) is
          # written to <stage>.stdout.log for the existing empty-output
          # checks; per-stage usage is appended to usage.jsonl for the
          # report stage to aggregate.
          local attempt
          for attempt in 1 2; do
            if claude --print --output-format json --dangerously-skip-permissions \
                       --plugin-dir "$PLUGIN_DIR" \
                       "$prompt" > "$raw" 2>"$RUN_DIR/$stage.stderr.log"; then
              break
            fi
            if [[ $attempt -lt 2 ]]; then
              echo "::warning::Stage $stage attempt $attempt failed; retrying once"
              sleep 5
            fi
          done
          # Extract the model's text response into <stage>.stdout.log
          # for downstream consumers that grep it.
          if [[ -s "$raw" ]]; then
            python3 -c "import json; d=json.load(open('$raw')); print(d.get('result',''))" > "$out" 2>/dev/null || cp "$raw" "$out"
            # Append usage line for the cost summary
            python3 -c "import json,sys; d=json.load(open('$raw')); u=d.get('usage') or {}; cost=d.get('total_cost_usd') or 0; sys.stdout.write(json.dumps({'stage':'$stage','tokens_in':u.get('input_tokens',0)+u.get('cache_read_input_tokens',0),'tokens_out':u.get('output_tokens',0),'cost_usd':cost})+'\n')" >> "$RUN_DIR/usage.jsonl" 2>/dev/null || true
          else
            : > "$out"
          fi
          if ! grep -q . "$out" 2>/dev/null; then
            echo "::error::Stage $stage: empty output after retries"
            echo "PROCTOR_PIPELINE_FAILED stage=$stage reason=claude-error" \
              | tee -a /tmp/proctor-stdout.log
            echo "::endgroup::"
            return 1
          fi
          echo "[proctor:$stage] done"
          echo "::endgroup::"
        }

        validate_json() {
          local path="$1" validator="$2"
          python3 -c "import json, sys; sys.path.insert(0, '$PYTHONPATH'); from plugins.proctor.scripts.schema import $validator as v; v(json.load(open('$path'))); print('$path validated')"
        }

        # ---- Stage 1: analyze (skipped in rerun mode) ----
        if [[ "$PROCTOR_MODE" != "rerun" ]]; then
          run_stage analyze "Apply the analyzing-pr-changes skill against PR #${PR} in ${REPO}.

        Inputs (already fetched, just read them):
        - $RUN_DIR/pr.json — PR metadata as JSON (includes title and body)
        - $RUN_DIR/diff.patch — unified diff

        Output: write a ChangeMap JSON to $RUN_DIR/change-map.json matching the contract documented in the skill: pr, pr_context, hunks, categories_present. Use only the categories: frontend, api, schema, infra, mobile, cli, docs (no e2e-flow — that's added by the planner). Use only risks: low, medium, high.

        IMPORTANT: populate pr_context per the skill's procedure step 2 — extract title, body, links (URLs in the body, especially Slack/Jira/Linear/Notion/Confluence/Figma), and requirement_hints (acceptance-criteria style snippets), and directives (HTML comments like <!-- proctor:skip-paths a/ b/ -->, <!-- proctor:skip-categories docs --> etc. per the skill). Apply path/category directives BEFORE classifying hunks (per skill steps 3 + 6) so test items are never planned for skipped paths.

        Do not output anything but a single short status line confirming the file is written. Do NOT include the full JSON in your reply." || exit 1
          validate_json "$RUN_DIR/change-map.json" validate_change_map || exit 1
        else
          echo "[proctor:analyze] skipped (rerun mode; using cached change-map.json from previous run)"
        fi

        # ---- Stage 2: plan (skipped in rerun mode) ----
        if [[ "$PROCTOR_MODE" != "rerun" ]]; then
          run_stage plan "Apply the planning-pr-tests skill.

        Inputs:
        - $RUN_DIR/change-map.json — including pr_context (title, body, links, requirement_hints, directives)
        - .pr-test.yml at the repo root (read it for setup, base_url, test_focus, per_test_timeout_seconds, auto_fix)

        Output: write a TestPlan JSON to $RUN_DIR/test-plan.json matching the contract. Honor the tool selection priority documented in the skill (lint-only first, then bash with existing tests, then curl, then chrome-devtools). Only plan curl / chrome-devtools items if .pr-test.yml has setup commands that bring up the relevant server.

        IMPORTANT — read pr_context. The PR description often contains the actual acceptance criteria (concrete numbers, behaviors, references to Slack/Jira/Linear tickets). When pr_context.body or pr_context.requirement_hints contain a concrete claim, generate test items that verify that exact claim, phrased in the body's wording. When body links to an off-PR doc without quoting it, write 'Per <ticket-id>: ...' in the item's how: field and mark risk: medium. If body and diff disagree, plan items for both. If pr_context.directives.max_items is set, treat it as a soft cap on item count.

        Reply with only a short status line." || exit 1
          validate_json "$RUN_DIR/test-plan.json" validate_test_plan || exit 1
        else
          echo "[proctor:plan] skipped (rerun mode; using cached test-plan.json filtered to rerun_ids)"
          validate_json "$RUN_DIR/test-plan.json" validate_test_plan || exit 1
        fi

        # ---- Stage 3: execute ----
        # Per-item bash dispatch. One claude --print per test item keeps each
        # invocation's context small enough that heavy chrome-devtools items
        # don't bloat the parent and cause the bail-with-empty-output failure
        # we hit on v0.1.17 with PRs spanning 5+ chrome-devtools items.
        mkdir -p "$RUN_DIR/screenshots" "$RUN_DIR/logs" "$RUN_DIR/results"
        echo "::group::Stage: execute"
        echo "[proctor:execute] start"

        # Force-push guard: if PR head moved while we were planning, bail.
        CURRENT_HEAD="$(gh pr view "$PR" -R "$REPO" --json headRefOid --jq '.headRefOid')"
        if [[ "$CURRENT_HEAD" != "$PR_HEAD_SHA" ]]; then
          echo "::error::PR head changed during run ($PR_HEAD_SHA -> $CURRENT_HEAD); aborting execute"
          echo "PROCTOR_PIPELINE_FAILED stage=execute reason=force-push" | tee -a /tmp/proctor-stdout.log
          exit 1
        fi

        # Read .pr-test.yml for base_url / timeout
        BASE_URL=$(python3 -c "import yaml; cfg=yaml.safe_load(open('.pr-test.yml')) or {}; print(cfg.get('base_url','http://127.0.0.1:5173'))" 2>/dev/null || echo "http://127.0.0.1:5173")
        ITEM_TIMEOUT=$(python3 -c "import yaml; cfg=yaml.safe_load(open('.pr-test.yml')) or {}; print(cfg.get('per_test_timeout_seconds', 60))" 2>/dev/null || echo 60)

        # Bucket items by tool. Lint-only items get batched into ONE claude
        # call (single plugin load, single startup overhead) — 30-50% cost
        # cut on grep-heavy PRs since input tokens drop dramatically. Runtime
        # items (chrome-devtools, curl, bash) still dispatch per-item in
        # parallel — they need their own environment per call.
        ITEM_COUNT=$(python3 -c "import json; print(len(json.load(open('$RUN_DIR/test-plan.json'))['items']))")
        CONCURRENCY="${PROCTOR_EXECUTE_CONCURRENCY:-3}"
        LINT_IDS=()
        RUNTIME_IDS=()
        while IFS=$'\t' read -r id tool; do
          if [[ "$tool" == "lint-only" ]]; then
            LINT_IDS+=("$id")
          else
            RUNTIME_IDS+=("$id")
          fi
        done < <(python3 -c "import json; [print(f\"{i['id']}\t{i.get('tool','')}\") for i in json.load(open('$RUN_DIR/test-plan.json'))['items']]")
        echo "[proctor:execute] $ITEM_COUNT items: ${#LINT_IDS[@]} lint-only (batched), ${#RUNTIME_IDS[@]} runtime (parallel @${CONCURRENCY}); base_url=$BASE_URL, timeout=${ITEM_TIMEOUT}s"

        run_item() {
          local ITEM_ID="$1"
          local ITEM_JSON
          ITEM_JSON=$(python3 -c "import json; print(json.dumps([i for i in json.load(open('$RUN_DIR/test-plan.json'))['items'] if i['id']=='$ITEM_ID'][0]))")
          local ITEM_PROMPT="Run the pr-test-executor subagent against this single test item and write its result to $RUN_DIR/results/${ITEM_ID}.json (one JSON object). Return only a short status line.

        Item:
        $ITEM_JSON

        Environment:
        - base_url: $BASE_URL
        - per_test_timeout_seconds: $ITEM_TIMEOUT
        - logs_dir: $RUN_DIR  (the executor's logs_ref should be $RUN_DIR/logs/${ITEM_ID}.log and screenshot_ref, when chrome-devtools is used, must be $RUN_DIR/screenshots/${ITEM_ID}.png)

        The result JSON MUST include id, status (pass|fail|skipped), evidence (1-2 sentences citing actual observed values). It SHOULD include command, output_excerpt (4 KB max), logs_ref. For chrome-devtools items, screenshot_ref is REQUIRED — capture via take_screenshot before returning. Also include screenshot_focus: a one-sentence description of WHICH region of the screenshot validates the evidence (or 'evidence not visible in screenshot — verified via DOM only' when the assertion is on document.title or other non-visible element)."

          local attempt
          for attempt in 1 2; do
            if claude --print --output-format json --dangerously-skip-permissions \
                       --plugin-dir "$PLUGIN_DIR" \
                       "$ITEM_PROMPT" > "$RUN_DIR/logs/${ITEM_ID}.exec.log" 2>&1; then
              break
            fi
            echo "::warning::item $ITEM_ID attempt $attempt failed; retrying once"
            sleep 5
          done
          # Capture per-item usage from the JSON wrapper
          if python3 -c "import json,sys; d=json.load(open('$RUN_DIR/logs/${ITEM_ID}.exec.log')); u=d.get('usage') or {}; cost=d.get('total_cost_usd') or 0; sys.stdout.write(json.dumps({'id':'$ITEM_ID','stage':'execute','tokens_in':u.get('input_tokens',0)+u.get('cache_read_input_tokens',0),'tokens_out':u.get('output_tokens',0),'cost_usd':cost})+'\n')" >> "$RUN_DIR/usage.jsonl" 2>/dev/null; then
            :
          fi
          # Synthesize a fail entry if the executor never wrote a result file
          if [[ ! -s "$RUN_DIR/results/${ITEM_ID}.json" ]]; then
            echo "::warning::item $ITEM_ID produced no result file — recording as fail/error"
            cat > "$RUN_DIR/results/${ITEM_ID}.json" <<JSON
        {"id":"$ITEM_ID","status":"fail","reason":"error","evidence":"Executor returned no result for this item after retries; see logs/${ITEM_ID}.exec.log."}
        JSON
          fi
        }

        run_lint_batch() {
          local ids=("$@")
          (( ${#ids[@]} == 0 )) && return 0
          local ids_csv; ids_csv=$(IFS=,; echo "${ids[*]}")
          echo "::group::lint-only batch: $ids_csv"
          local items_json
          items_json=$(python3 -c "import json; ids=set('$ids_csv'.split(',')); print(json.dumps([i for i in json.load(open('$RUN_DIR/test-plan.json'))['items'] if i['id'] in ids], indent=2))")
          local PROMPT="You are running ALL of the following lint-only test items. They are pure source-level checks (grep/awk/jq against the repo files at HEAD) — no server, no browser. Run them yourself in this single response, do not dispatch subagents (the per-item subagent overhead is wasteful for these).

        For each item, write its result JSON to $RUN_DIR/results/<id>.json. Each result MUST include id, status (pass|fail|skipped), evidence (1-2 sentences citing actual observed values, including line numbers when applicable). It SHOULD include command (the literal grep/awk you ran), output_excerpt (the matched lines or a brief failure message). logs_ref/screenshot_ref are not required for lint-only items.

        After all results are written, reply with a single short status line summarizing pass/fail counts. Do NOT include the JSON in your reply.

        Items to run:
        $items_json"
          local attempt
          for attempt in 1 2; do
            if claude --print --output-format json --dangerously-skip-permissions \
                       --plugin-dir "$PLUGIN_DIR" \
                       "$PROMPT" > "$RUN_DIR/logs/lint-batch.exec.log" 2>&1; then
              break
            fi
            echo "::warning::lint batch attempt $attempt failed; retrying once"
            sleep 5
          done
          # Capture batch usage as a single 'stage=execute-lint-batch' line
          python3 -c "import json,sys; d=json.load(open('$RUN_DIR/logs/lint-batch.exec.log')); u=d.get('usage') or {}; cost=d.get('total_cost_usd') or 0; sys.stdout.write(json.dumps({'stage':'execute','substage':'lint-batch','items':$(echo "${#ids[@]}"),'tokens_in':u.get('input_tokens',0)+u.get('cache_read_input_tokens',0),'tokens_out':u.get('output_tokens',0),'cost_usd':cost})+'\n')" >> "$RUN_DIR/usage.jsonl" 2>/dev/null || true
          # Synthesize fail entries for any item the batch didn't write
          for ITEM_ID in "${ids[@]}"; do
            if [[ ! -s "$RUN_DIR/results/${ITEM_ID}.json" ]]; then
              echo "::warning::lint item $ITEM_ID missing result; recording as fail/error"
              cat > "$RUN_DIR/results/${ITEM_ID}.json" <<JSON
        {"id":"$ITEM_ID","status":"fail","reason":"error","evidence":"Lint batch did not write a result for this item; see logs/lint-batch.exec.log."}
        JSON
            fi
          done
          echo "::endgroup::"
        }

        # 1. Run all lint-only items as one batched call (sequential to other stages)
        run_lint_batch "${LINT_IDS[@]}"

        # 2. Concurrency-limited parallel dispatch for runtime items
        running=0
        for ITEM_ID in "${RUNTIME_IDS[@]}"; do
          if (( running >= CONCURRENCY )); then
            wait -n
            running=$((running - 1))
          fi
          ( run_item "$ITEM_ID" ) &
          running=$((running + 1))
        done
        wait

        # Aggregate per-item results into one TestResults file.
        python3 - <<PY
        import json, os
        run_dir = "$RUN_DIR"
        plan = json.load(open(os.path.join(run_dir, "test-plan.json")))
        items = []
        for it in plan["items"]:
            p = os.path.join(run_dir, "results", f"{it['id']}.json")
            try:
                items.append(json.load(open(p)))
            except Exception as e:
                items.append({"id": it["id"], "status": "fail", "reason": "error",
                              "evidence": f"Result file unreadable: {e}"})
        summary = {"total": len(items), "pass": 0, "fail": 0, "skipped": 0}
        for it in items:
            summary[it.get("status", "fail")] = summary.get(it.get("status", "fail"), 0) + 1
        json.dump({"items": items, "summary": summary},
                  open(os.path.join(run_dir, "test-results.json"), "w"),
                  indent=2)
        print(f"[proctor:execute] aggregated: pass={summary['pass']} fail={summary['fail']} skipped={summary['skipped']}")
        PY
        echo "[proctor:execute] done"
        echo "::endgroup::"
        validate_json "$RUN_DIR/test-results.json" validate_test_results || exit 1

        # ---- Visual regression: capture head + diff against baseline ----
        if [[ "$VISUAL_REG" == "true" && -s "$RUN_DIR/visual/baseline.png" ]]; then
          echo "::group::Visual regression: head capture + diff"
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || command -v chrome || echo '')"
          if [[ -n "$CHROME_BIN" ]]; then
            "$CHROME_BIN" --headless --disable-gpu --no-sandbox \
                          --hide-scrollbars --window-size=1280,800 \
                          --screenshot="$RUN_DIR/visual/head.png" \
                          "$BASE_URL" > /dev/null 2>&1 || true
          fi
          if [[ -s "$RUN_DIR/visual/head.png" ]] && command -v compare >/dev/null 2>&1; then
            # ImageMagick `compare` returns non-zero when images differ — that's fine.
            # -metric AE = absolute pixel error count, -fuzz 5% tolerates anti-aliasing.
            DIFF_PIXELS=$(compare -metric AE -fuzz 5% \
              "$RUN_DIR/visual/baseline.png" "$RUN_DIR/visual/head.png" \
              "$RUN_DIR/visual/diff.png" 2>&1 | tail -1 | tr -d '[:alpha:]@ ' || echo "?")
            echo "[proctor:visual-reg] diff_pixels=$DIFF_PIXELS"
            export PROCTOR_VISUAL_DIFF_PIXELS="$DIFF_PIXELS"
          else
            echo "::warning::No 'compare' (ImageMagick) available or head.png missing; skipping diff"
          fi
          echo "::endgroup::"
        fi

        # Decide whether stage 4 should run
        FAIL_COUNT=$(python3 -c "import json; print(json.load(open('$RUN_DIR/test-results.json'))['summary']['fail'])")
        AUTO_FIX=$(python3 -c "import os, yaml; cfg = yaml.safe_load(open('.pr-test.yml')) if os.path.exists('.pr-test.yml') else {}; print('true' if (cfg or {}).get('auto_fix', True) else 'false')")
        if [[ "$FAIL_COUNT" -gt 0 && "$AUTO_FIX" == "true" ]]; then
          # Tolerant: if the fixer fails (timeout, can't produce a patch,
          # or returns non-zero for any reason), don't abort the pipeline
          # — we still want stage 5 to post a 'needs human review' report.
          # The report skill reads fix-pr-ref.json; null means no fix PR.
          if ! run_stage fix "Apply the fixing-test-failures skill.

        Inputs:
        - $RUN_DIR/test-results.json — has $FAIL_COUNT failed items
        - $RUN_DIR/change-map.json — hunks that the failed tests probed
        - PR head ref: $(jq -r .headRefName < "$RUN_DIR/pr.json")

        Output: write FixPRRef JSON to $RUN_DIR/fix-pr-ref.json (or 'null'). Open the fix PR via gh and capture its number/url/branch in the JSON. Reply with only a short status line."; then
            echo "::warning::Fix stage failed; downgrading to 'needs human review' and continuing to report"
            echo "null" > "$RUN_DIR/fix-pr-ref.json"
          fi
          # Defensive: if the fixer returned 0 but didn't write a valid
          # FixPRRef, also fall back to null so stage 5 can render.
          if ! validate_json "$RUN_DIR/fix-pr-ref.json" validate_fix_pr_ref 2>/dev/null; then
            echo "::warning::fix-pr-ref.json missing or invalid; treating as null"
            echo "null" > "$RUN_DIR/fix-pr-ref.json"
          fi
        else
          echo "[proctor:fix] skipped fail=$FAIL_COUNT auto_fix=$AUTO_FIX"
          echo "null" > "$RUN_DIR/fix-pr-ref.json"
        fi
        validate_json "$RUN_DIR/fix-pr-ref.json" validate_fix_pr_ref || exit 1

        # ---- Push screenshots to a dedicated branch for inline embedding ----
        # GitHub PR comments can't render images from Action artifacts, so we
        # push any screenshot PNGs to an orphan branch named `proctor-screenshots`
        # under the run-id directory and reference them by raw.githubusercontent
        # URL from the report. The branch is opaque infra: each run adds a
        # subdirectory; older runs accumulate but are never modified.
        SCREENSHOT_URL_BASE=""
        VISUAL_URL_BASE=""
        # Push if either per-item screenshots OR visual regression artifacts exist
        if (ls "$RUN_DIR/screenshots"/*.png >/dev/null 2>&1) || \
           [[ -s "$RUN_DIR/visual/baseline.png" ]]; then
          ss_count=$(ls "$RUN_DIR/screenshots"/*.png 2>/dev/null | wc -l | tr -d ' ' || echo 0)
          vis_count=$(ls "$RUN_DIR/visual"/*.png 2>/dev/null | wc -l | tr -d ' ' || echo 0)
          echo "[proctor:screenshots] pushing $ss_count item PNG(s) + $vis_count visual PNG(s) to proctor-screenshots branch"
          ss_dir="$(mktemp -d)"
          ss_url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # Try clone first (handles existing branch + isolated history).
          # Fall back to git init if the branch doesn't exist yet.
          if git clone --depth 1 --branch proctor-screenshots --quiet "$ss_url" "$ss_dir" 2>/dev/null; then
            echo "(cloned existing proctor-screenshots branch)"
          else
            echo "(no existing proctor-screenshots branch — initializing)"
            rm -rf "$ss_dir"
            ss_dir="$(mktemp -d)"
            git -C "$ss_dir" init -q -b proctor-screenshots
            git -C "$ss_dir" config user.name "github-actions[bot]"
            git -C "$ss_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            : > "$ss_dir/.proctor-screenshots-marker"
            git -C "$ss_dir" add .proctor-screenshots-marker
            git -C "$ss_dir" commit -q -m "init proctor-screenshots branch"
          fi
          # Always set identity for the new commit (clone case doesn't carry it
          # over from the workflow runner).
          git -C "$ss_dir" config user.name "github-actions[bot]"
          git -C "$ss_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p "$ss_dir/$RUN_ID"
          # Per-item screenshots (chrome-devtools tests)
          if ls "$RUN_DIR/screenshots"/*.png >/dev/null 2>&1; then
            cp "$RUN_DIR"/screenshots/*.png "$ss_dir/$RUN_ID/"
          fi
          # Visual regression triplet (baseline / head / diff) under a subdir
          if [[ -d "$RUN_DIR/visual" ]] && ls "$RUN_DIR/visual"/*.png >/dev/null 2>&1; then
            mkdir -p "$ss_dir/$RUN_ID/visual"
            cp "$RUN_DIR"/visual/*.png "$ss_dir/$RUN_ID/visual/"
          fi
          git -C "$ss_dir" add "$RUN_ID"
          git -C "$ss_dir" commit -q -m "screenshots: $RUN_ID"

          # Retention: keep only the most recent N run subdirs. Older
          # ones are removed and the deletion is committed. PRs that
          # reference long-deleted screenshots will degrade to broken
          # images, which is acceptable trade-off vs unbounded growth.
          # Override via PROCTOR_SCREENSHOT_RETENTION (default: 30 runs).
          RETAIN="${PROCTOR_SCREENSHOT_RETENTION:-30}"
          # List subdirs (excluding the marker file and .git), newest first by name (run-ids are time-ordered),
          # drop the first $RETAIN, delete the rest.
          ls -1 "$ss_dir" 2>/dev/null \
            | grep -v '^\.\(proctor-screenshots-marker\|git\)$' \
            | grep -v '^.proctor-screenshots-marker$' \
            | sort -r \
            | tail -n +"$((RETAIN + 1))" \
            > /tmp/proctor-ss-prune.txt || true
          if [[ -s /tmp/proctor-ss-prune.txt ]]; then
            removed=$(wc -l < /tmp/proctor-ss-prune.txt | tr -d ' ')
            echo "[proctor:screenshots] retention: removing $removed old run-id subdirs (keep $RETAIN)"
            while IFS= read -r olddir; do
              [[ -z "$olddir" ]] && continue
              git -C "$ss_dir" rm -rq "$olddir" 2>/dev/null || rm -rf "$ss_dir/$olddir"
            done < /tmp/proctor-ss-prune.txt
            if ! git -C "$ss_dir" diff --quiet --cached; then
              git -C "$ss_dir" commit -q -m "screenshots: prune to last $RETAIN runs"
            fi
          fi

          # Force push handles parallel-run rewrites; the screenshots
          # branch is opaque infra and history-rewrite collisions are
          # acceptable.
          push_ok=0
          for attempt in 1 2; do
            if git -C "$ss_dir" push --quiet --force "$ss_url" proctor-screenshots; then
              push_ok=1; break
            fi
            echo "::warning::screenshots push attempt $attempt failed; retrying"
            sleep 2
          done
          if [[ "$push_ok" -eq 1 ]]; then
            SCREENSHOT_URL_BASE="${GITHUB_SERVER_URL}/${REPO}/raw/proctor-screenshots/${RUN_ID}/"
            VISUAL_URL_BASE="${GITHUB_SERVER_URL}/${REPO}/raw/proctor-screenshots/${RUN_ID}/visual/"
            echo "[proctor:screenshots] published at $SCREENSHOT_URL_BASE"
          else
            echo "::warning::Failed to push screenshots branch after retries; falling back to artifact-only references"
          fi
          rm -rf "$ss_dir"
        fi
        export SCREENSHOT_URL_BASE VISUAL_URL_BASE

        # ---- Aggregate cost from usage.jsonl ----
        # Sum tokens + cost across all stages and per-item executions so
        # the report can show consumers what each PR run cost. Also build
        # a per-stage breakdown so they know where the budget went.
        if [[ -s "$RUN_DIR/usage.jsonl" ]]; then
          PROCTOR_USAGE_SUMMARY=$(python3 -c "
        import json
        from collections import defaultdict
        tin = tout = 0
        cost = 0.0
        by_stage = defaultdict(lambda: {'tin':0,'tout':0,'cost':0.0,'n':0})
        for ln in open('$RUN_DIR/usage.jsonl'):
            try:
                d = json.loads(ln)
                ti = int(d.get('tokens_in')  or 0)
                to = int(d.get('tokens_out') or 0)
                c  = float(d.get('cost_usd') or 0)
                tin  += ti; tout += to; cost += c
                stage = d.get('stage','unknown')
                if d.get('substage') == 'lint-batch':
                    stage = 'execute-lint-batch'
                by_stage[stage]['tin']  += ti
                by_stage[stage]['tout'] += to
                by_stage[stage]['cost'] += c
                by_stage[stage]['n']    += 1
            except Exception:
                pass
        # Render as 'tokens_in=X tokens_out=Y cost_usd=Z|stage1=\$A stage2=\$B ...'
        breakdown = ' '.join(f'{s}=\${by_stage[s][\"cost\"]:.3f}({by_stage[s][\"n\"]})' for s in sorted(by_stage.keys()))
        print(f'tokens_in={tin} tokens_out={tout} cost_usd={cost:.4f}|{breakdown}')
          ")
          echo "[proctor:usage] $PROCTOR_USAGE_SUMMARY"
        else
          PROCTOR_USAGE_SUMMARY=""
        fi
        export PROCTOR_USAGE_SUMMARY

        # ---- Stage 5: report ----
        # Pass through env so the report skill can build Action / artifact URLs
        export RUN_ID
        export GITHUB_RUN_ID="${{ github.run_id }}"
        export GITHUB_SERVER_URL="${{ github.server_url }}"
        run_stage report "Apply the reporting-pr-test-results skill.

        Inputs (read these files):
        - $RUN_DIR/test-results.json
        - $RUN_DIR/fix-pr-ref.json (may be null)
        - $RUN_DIR/change-map.json

        Environment values for cross-linking:
        - PR=$PR, REPO=$REPO, RUN_ID=$RUN_ID
        - GITHUB_RUN_ID=$GITHUB_RUN_ID, GITHUB_SERVER_URL=$GITHUB_SERVER_URL
        - SCREENSHOT_URL_BASE=$SCREENSHOT_URL_BASE  (empty if no screenshots were captured; else a public raw URL prefix like https://github.com/owner/repo/raw/proctor-screenshots/<run-id>/)
        - VISUAL_URL_BASE=$VISUAL_URL_BASE  (empty unless visual regression captured; when non-empty the directory contains baseline.png + head.png + diff.png — render a 'Visual regression' section in the report)
        - PROCTOR_VISUAL_DIFF_PIXELS=$PROCTOR_VISUAL_DIFF_PIXELS  (number of differing pixels at 5% fuzz; 0 means no visible change)
        - PROCTOR_USAGE_SUMMARY=$PROCTOR_USAGE_SUMMARY  (e.g. 'tokens_in=45000 tokens_out=8000 cost_usd=0.1234'; render in the header as a Cost line per the skill procedure)
        - Action run URL: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID
        - Artifact URL: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID#artifacts

        Render per the skill procedure: header with Action + artifact links, then a per-item <details> section for EACH item with What it did, Evidence, Command, Output, Screenshot, Logs. ALWAYS include a Screenshot subsection for items that have screenshot_ref — when SCREENSHOT_URL_BASE is non-empty, embed the image inline as a markdown image whose URL is SCREENSHOT_URL_BASE concatenated with the basename of screenshot_ref; when SCREENSHOT_URL_BASE is empty, fall back to a path-in-artifact reference. Fail items must default <details open>. Post the rendered comment via:
          gh pr comment $PR -R $REPO --body-file <path-to-rendered>
        Confirm posting succeeded by reading the comment back via 'gh pr view $PR -R $REPO --json comments'.

        Save the rendered markdown to $RUN_DIR/report.md as well so the artifact has it.

        Reply with only a short status line." || exit 1

        # All stages done — emit the COMPLETE marker
        echo "PROCTOR_PIPELINE_COMPLETE pr=$PR run_id=$RUN_ID" \
          | tee -a /tmp/proctor-stdout.log

    - name: Verify pipeline completed
      if: steps.antiloop.outputs.skip != 'true'
      shell: bash
      run: |
        if grep -q "PROCTOR_PIPELINE_COMPLETE" /tmp/proctor-stdout.log 2>/dev/null; then
          echo "Pipeline marker found — all stages ran."
          exit 0
        fi
        echo "::error::PRoctor pipeline did not reach the COMPLETE marker." >&2
        if grep -q "PROCTOR_PIPELINE_FAILED" /tmp/proctor-stdout.log 2>/dev/null; then
          grep "PROCTOR_PIPELINE_FAILED" /tmp/proctor-stdout.log >&2
        fi
        exit 1

    - name: Sanitize run-id paths for artifact upload
      if: always()
      shell: bash
      run: |
        # GitHub artifacts reject : " < > | * ? \r \n in any path component.
        # The model is supposed to call runlog.make_run_id (which never
        # produces invalid chars), but if it improvises an ISO timestamp
        # in the run-id we'd lose the artifact. Rename defensively here.
        if [[ ! -d .proctor/runs ]]; then
          echo "No .proctor/runs to sanitize."
          exit 0
        fi
        cd .proctor/runs
        for d in */; do
          d="${d%/}"
          clean="$(echo -n "$d" | tr ':"<>|*?\r\n' '_')"
          if [[ "$d" != "$clean" ]]; then
            echo "Sanitizing run-id: $d -> $clean"
            mv -- "$d" "$clean"
          fi
        done

    - name: Upload run artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: proctor-run-${{ steps.resolve.outputs.pr }}
        path: .proctor/runs/
        if-no-files-found: warn
