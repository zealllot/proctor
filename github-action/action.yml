name: PRoctor
description: AI-driven PR test runner — analyze, plan, execute, fix, report.
inputs:
  anthropic-api-key:
    description: ANTHROPIC_API_KEY for Claude Code. Either this OR claude-code-oauth-token must be provided.
    required: false
  claude-code-oauth-token:
    description: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`. Use this when authenticating with a Claude.ai subscription instead of an Anthropic API key. Either this OR anthropic-api-key must be provided.
    required: false
  pr-number:
    description: PR number. Defaults to the event's PR number if available.
    required: false
runs:
  using: composite
  steps:
    - name: Verify Claude auth provided
      shell: bash
      run: |
        if [[ -z "${{ inputs.anthropic-api-key }}" && -z "${{ inputs.claude-code-oauth-token }}" ]]; then
          echo "ERR: PRoctor needs either 'anthropic-api-key' or 'claude-code-oauth-token' as an input. Neither was set." >&2
          echo "  - For an Anthropic API key, get one at https://console.anthropic.com" >&2
          echo "  - For a Claude.ai subscription, run 'claude setup-token' locally to generate an OAuth token." >&2
          exit 1
        fi

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve PR number
      id: resolve
      shell: bash
      run: |
        if [[ -n "${{ inputs.pr-number }}" ]]; then
          echo "pr=${{ inputs.pr-number }}" >> "$GITHUB_OUTPUT"
        elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
        elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
          echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
        else
          echo "no PR number" >&2; exit 1
        fi

    - name: Gate on issue_comment trigger
      if: github.event_name == 'issue_comment'
      shell: bash
      run: |
        if [[ "${{ github.event.comment.body }}" != *"/proctor run"* ]]; then
          echo "Comment is not a PRoctor run trigger; skipping."
          exit 78  # neutral exit (older runners) — newer ignore this
        fi
        # Require write access to the repo from the commenter
        gh api -H "Accept: application/vnd.github+json" \
          repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission \
          --jq '.permission' | grep -E '^(admin|write|maintain)$' \
          || { echo "commenter lacks write access"; exit 1; }
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Install Claude Code
      shell: bash
      run: |
        curl -fsSL https://claude.ai/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run PRoctor
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_ACTIONS: "true"
        PR: ${{ steps.resolve.outputs.pr }}
        REPO: ${{ github.repository }}
      run: |
        # claude --print does not process slash commands. Invoke the
        # pipeline by prompt instead; the plugin is loaded via --plugin-dir.
        # The single-quoted heredoc keeps backticks/${...} from being
        # interpreted by bash; PR/REPO are spliced in via sed afterwards.
        cat > /tmp/proctor-prompt.txt <<'PROMPT_EOF'
        You are running the PRoctor pipeline against PR #__PR__ in repository __REPO__, headlessly inside a GitHub Action. The PRoctor plugin is loaded; its 5 skills and 2 subagents are available.

        ABSOLUTE RULE — read carefully: this is a SINGLE non-interactive autonomous task. You are NOT in a chat. There is no human to respond to between stages. Your final stdout response MUST be the COMPLETE marker (or FAILED marker on hard error) AFTER all 5 stages have run. Returning a partial summary, an analyze-only result, or any other "I'll continue in the next turn" content WILL fail the entire job and waste tokens.

        How to think about it: you have a list of 5 procedures to execute serially. After each one, the next runs immediately, in the same response. Only when stage 5 finishes do you emit the marker. Do not seek confirmation. Do not pause. Do not summarize partial progress. You have full permissions via --dangerously-skip-permissions; every gh / git / Bash / file-write call you need will succeed without asking.

        Run-id: derive ONCE at the very start by calling python3 -c 'from plugins.proctor.scripts.runlog import make_run_id; print(make_run_id(pr_number=__PR__, head_sha="<sha>", started_at_iso="<iso>"))'. The result has format pr<num>-<7-char-sha>-<8-char-hash> with NO colons, slashes, or other special characters. Reuse this exact value for the whole pipeline. Persist every stage output to .proctor/runs/<run-id>/. Never invent your own run-id format — GitHub Action artifact paths reject colons, so a freeform ISO timestamp like 2026-05-09T05:43:42Z would break the upload step.

        === Stage 1: analyze ===
        Apply skill analyzing-pr-changes. Fetch PR data with: gh pr view __PR__ --json number,headRefOid,baseRefOid,url,headRefName,baseRefName,title,body,author -R __REPO__   AND   gh pr diff __PR__ -R __REPO__. Save the ChangeMap to change-map.json. Validate via plugins/proctor/scripts/schema.py:validate_change_map. Print one line on its own: [proctor:analyze] done hunks=N categories=[...]
        Then immediately proceed to Stage 2. Do not wait. Do not narrate.

        === Stage 2: plan ===
        Apply skill planning-pr-tests to the ChangeMap. Save TestPlan to test-plan.json. Validate. Print: [proctor:plan] done items=N
        Then immediately proceed to Stage 3.

        === Stage 3: execute ===
        Apply skill executing-pr-tests. Mode is CI; require_approval defaults false. Run setup commands from .pr-test.yml first (install deps, start servers, wait for readiness). For each test item, dispatch the pr-test-executor subagent via the Task tool with the item, base_url from .pr-test.yml, and a per_test_timeout_seconds value from .pr-test.yml. Save TestResults to test-results.json. Validate. Print: [proctor:execute] done pass=N fail=N skipped=N
        Then immediately proceed to Stage 4.

        === Stage 4: fix ===
        Apply skill fixing-test-failures IFF TestResults has any failed items AND .pr-test.yml.auto_fix is true (default true). For zero failures, skip and write null to fix-pr-ref.json. Print: [proctor:fix] done <action>
        Then immediately proceed to Stage 5.

        === Stage 5: report ===
        Apply skill reporting-pr-test-results. Render the markdown report. Post it as a PR comment using: gh pr comment __PR__ -R __REPO__ --body-file <rendered-report.md>. Confirm posting succeeded by reading the comment back via: gh pr view __PR__ -R __REPO__ --json comments. Print: [proctor:report] done comment_posted=true
        Then proceed to Final.

        === Final ===
        Print this EXACT line as the very last line of your response, on its own:
          PROCTOR_PIPELINE_COMPLETE pr=__PR__ run_id=<run-id>

        Self-check before you stop responding: have all five [proctor:<stage>] done lines been printed in this response? If any are missing, you have not completed the task — go back and run the missing stages. Only after all five have been printed AND the comment has been posted, emit the COMPLETE marker.

        On hard error: print 'PROCTOR_PIPELINE_FAILED stage=<name> reason=<short>' instead of COMPLETE; do NOT print COMPLETE in that case.
        PROMPT_EOF
        sed -i "s|__PR__|${PR}|g; s|__REPO__|${REPO}|g" /tmp/proctor-prompt.txt

        # --dangerously-skip-permissions: in CI the workflow file is the
        # trust boundary; the runner is ephemeral, credentials scoped to
        # this PR. Without it, gh/git operations stall on approval prompts.
        # Retry the run up to 2 times on early-bailout (no COMPLETE marker)
        # — the model's compliance with multi-stage prompts is not 100%
        # deterministic in --print mode.
        run_once() {
          claude --print --dangerously-skip-permissions \
                 --plugin-dir "${{ github.action_path }}/../plugins/proctor" \
                 "$(cat /tmp/proctor-prompt.txt)" | tee "$1"
        }
        run_once /tmp/proctor-stdout.log
        if ! grep -q "PROCTOR_PIPELINE_COMPLETE\|PROCTOR_PIPELINE_FAILED" /tmp/proctor-stdout.log; then
          echo "::warning::First run did not reach a marker. Retrying once."
          run_once /tmp/proctor-stdout.log
        fi
        if ! grep -q "PROCTOR_PIPELINE_COMPLETE\|PROCTOR_PIPELINE_FAILED" /tmp/proctor-stdout.log; then
          echo "::warning::Second run did not reach a marker either. Final retry."
          run_once /tmp/proctor-stdout.log
        fi

    - name: Verify pipeline completed
      shell: bash
      run: |
        if grep -q "PROCTOR_PIPELINE_COMPLETE" /tmp/proctor-stdout.log; then
          echo "Pipeline marker found — all 5 stages ran."
          exit 0
        fi
        echo "::error::PRoctor pipeline did not reach the COMPLETE marker." >&2
        if grep -q "PROCTOR_PIPELINE_FAILED" /tmp/proctor-stdout.log; then
          grep "PROCTOR_PIPELINE_FAILED" /tmp/proctor-stdout.log >&2
        else
          echo "::error::No FAILED marker either — model exited early without explicit failure." >&2
        fi
        exit 1

    - name: Sanitize run-id paths for artifact upload
      if: always()
      shell: bash
      run: |
        # GitHub artifacts reject : " < > | * ? \r \n in any path component.
        # The model is supposed to call runlog.make_run_id (which never
        # produces invalid chars), but if it improvises an ISO timestamp
        # in the run-id we'd lose the artifact. Rename defensively here.
        if [[ ! -d .proctor/runs ]]; then
          echo "No .proctor/runs to sanitize."
          exit 0
        fi
        cd .proctor/runs
        for d in */; do
          d="${d%/}"
          clean="$(echo -n "$d" | tr ':"<>|*?\r\n' '_')"
          if [[ "$d" != "$clean" ]]; then
            echo "Sanitizing run-id: $d -> $clean"
            mv -- "$d" "$clean"
          fi
        done

    - name: Upload run artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: proctor-run-${{ steps.resolve.outputs.pr }}
        path: .proctor/runs/
        if-no-files-found: warn
