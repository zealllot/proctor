name: PRoctor
description: AI-driven PR test runner — analyze, plan, execute, fix, report.
inputs:
  anthropic-api-key:
    description: ANTHROPIC_API_KEY for Claude Code. Either this OR claude-code-oauth-token must be provided.
    required: false
  claude-code-oauth-token:
    description: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`. Use this when authenticating with a Claude.ai subscription instead of an Anthropic API key. Either this OR anthropic-api-key must be provided.
    required: false
  pr-number:
    description: PR number. Defaults to the event's PR number if available.
    required: false
runs:
  using: composite
  steps:
    - name: Verify Claude auth provided
      shell: bash
      run: |
        if [[ -z "${{ inputs.anthropic-api-key }}" && -z "${{ inputs.claude-code-oauth-token }}" ]]; then
          echo "ERR: PRoctor needs either 'anthropic-api-key' or 'claude-code-oauth-token' as an input. Neither was set." >&2
          echo "  - For an Anthropic API key, get one at https://console.anthropic.com" >&2
          echo "  - For a Claude.ai subscription, run 'claude setup-token' locally to generate an OAuth token." >&2
          exit 1
        fi

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve PR number
      id: resolve
      shell: bash
      run: |
        if [[ -n "${{ inputs.pr-number }}" ]]; then
          echo "pr=${{ inputs.pr-number }}" >> "$GITHUB_OUTPUT"
        elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
        elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
          echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
        else
          echo "no PR number" >&2; exit 1
        fi

    - name: Gate on issue_comment trigger
      if: github.event_name == 'issue_comment'
      shell: bash
      run: |
        if [[ "${{ github.event.comment.body }}" != *"/proctor run"* ]]; then
          echo "Comment is not a PRoctor run trigger; skipping."
          exit 78  # neutral exit (older runners) — newer ignore this
        fi
        # Require write access to the repo from the commenter
        gh api -H "Accept: application/vnd.github+json" \
          repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission \
          --jq '.permission' | grep -E '^(admin|write|maintain)$' \
          || { echo "commenter lacks write access"; exit 1; }
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Install Claude Code
      shell: bash
      run: |
        curl -fsSL https://claude.ai/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run PRoctor (stage-by-stage)
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_ACTIONS: "true"
        PR: ${{ steps.resolve.outputs.pr }}
        REPO: ${{ github.repository }}
      run: |
        # Stage-by-stage orchestration: bash drives the pipeline; each
        # claude invocation handles ONE stage with a focused prompt.
        # Bash retries individual stages, validates JSON contracts via
        # schema.py, and aggregates structured logs in run-id directory.
        # This eliminates the multi-stage bailout vector we hit on
        # v0.1.4–v0.1.7 (model produced stage 1 output then exited).
        set -uo pipefail
        PLUGIN_DIR="${{ github.action_path }}/../plugins/proctor"
        PYTHONPATH="${{ github.action_path }}/.."
        export PYTHONPATH

        # Deterministic run-id (matches scripts/runlog.make_run_id format)
        PR_HEAD_SHA="$(gh pr view "$PR" -R "$REPO" --json headRefOid --jq '.headRefOid')"
        HASH="$(printf '%s' "${PR}|${PR_HEAD_SHA}|$(date -u +%Y%m%dT%H%M%SZ)" | shasum | cut -c1-8)"
        RUN_ID="pr${PR}-${PR_HEAD_SHA:0:7}-${HASH}"
        RUN_DIR=".proctor/runs/${RUN_ID}"
        mkdir -p "$RUN_DIR"
        echo "[proctor:run] start pr=$PR sha=$PR_HEAD_SHA run_id=$RUN_ID"

        # Pre-fetch PR data so the model doesn't have to (and to make
        # the analyze stage purely about classification).
        gh pr view "$PR" -R "$REPO" \
           --json number,headRefOid,baseRefOid,url,headRefName,baseRefName,title,body,author \
           > "$RUN_DIR/pr.json"
        gh pr diff "$PR" -R "$REPO" > "$RUN_DIR/diff.patch"

        # Run user-defined setup commands from .pr-test.yml (installs,
        # background servers, wait loops). Failures here are env-level
        # and abort the pipeline before any stage runs.
        if [[ -f .pr-test.yml ]]; then
          python3 -c "import yaml; print('\n'.join(yaml.safe_load(open('.pr-test.yml')).get('setup') or []))" > /tmp/proctor-setup-cmds.txt
          while IFS= read -r cmd; do
            [[ -z "$cmd" ]] && continue
            echo "[proctor:setup] running: $cmd"
            if ! bash -c "$cmd"; then
              echo "::error::Setup command failed: $cmd"
              echo "PROCTOR_PIPELINE_FAILED stage=setup reason=setup-command-failed" | tee -a /tmp/proctor-stdout.log
              exit 1
            fi
          done < /tmp/proctor-setup-cmds.txt
        fi

        run_stage() {
          local stage="$1" prompt="$2"
          local out="$RUN_DIR/$stage.stdout.log"
          echo "::group::Stage: $stage"
          echo "[proctor:$stage] start"
          # Single attempt per stage — focused prompts rarely bail. If
          # we hit flake later, add a retry here without affecting
          # surrounding stages.
          if ! claude --print --dangerously-skip-permissions \
                      --plugin-dir "$PLUGIN_DIR" \
                      "$prompt" 2>&1 | tee "$out"; then
            echo "::error::Stage $stage: claude returned non-zero"
            echo "PROCTOR_PIPELINE_FAILED stage=$stage reason=claude-error" \
              | tee -a /tmp/proctor-stdout.log
            echo "::endgroup::"
            return 1
          fi
          echo "[proctor:$stage] done"
          echo "::endgroup::"
        }

        validate_json() {
          local path="$1" validator="$2"
          python3 -c "import json, sys; sys.path.insert(0, '$PYTHONPATH'); from plugins.proctor.scripts.schema import $validator as v; v(json.load(open('$path'))); print('$path validated')"
        }

        # ---- Stage 1: analyze ----
        run_stage analyze "Apply the analyzing-pr-changes skill against PR #${PR} in ${REPO}.

        Inputs (already fetched, just read them):
        - $RUN_DIR/pr.json — PR metadata as JSON (includes title and body)
        - $RUN_DIR/diff.patch — unified diff

        Output: write a ChangeMap JSON to $RUN_DIR/change-map.json matching the contract documented in the skill: pr, pr_context, hunks, categories_present. Use only the categories: frontend, api, schema, infra, mobile, cli, docs (no e2e-flow — that's added by the planner). Use only risks: low, medium, high.

        IMPORTANT: populate pr_context per the skill's procedure step 2 — extract title, body, links (URLs in the body, especially Slack/Jira/Linear/Notion/Confluence/Figma), and requirement_hints (acceptance-criteria style snippets). Do NOT follow the URLs.

        Do not output anything but a single short status line confirming the file is written. Do NOT include the full JSON in your reply." || exit 1
        validate_json "$RUN_DIR/change-map.json" validate_change_map || exit 1

        # ---- Stage 2: plan ----
        run_stage plan "Apply the planning-pr-tests skill.

        Inputs:
        - $RUN_DIR/change-map.json — including pr_context (title, body, links, requirement_hints)
        - .pr-test.yml at the repo root (read it for setup, base_url, test_focus, per_test_timeout_seconds, auto_fix)

        Output: write a TestPlan JSON to $RUN_DIR/test-plan.json matching the contract. Honor the tool selection priority documented in the skill (lint-only first, then bash with existing tests, then curl, then chrome-devtools). Only plan curl / chrome-devtools items if .pr-test.yml has setup commands that bring up the relevant server.

        IMPORTANT — read pr_context. The PR description often contains the actual acceptance criteria (concrete numbers, behaviors, references to Slack/Jira/Linear tickets). When pr_context.body or pr_context.requirement_hints contain a concrete claim, generate test items that verify that exact claim, phrased in the body's wording. When body links to an off-PR doc without quoting it, write 'Per <ticket-id>: ...' in the item's how: field and mark risk: medium. If body and diff disagree, plan items for both.

        Reply with only a short status line." || exit 1
        validate_json "$RUN_DIR/test-plan.json" validate_test_plan || exit 1

        # ---- Stage 3: execute ----
        run_stage execute "Apply the executing-pr-tests skill.

        Inputs:
        - $RUN_DIR/test-plan.json — items to run
        - $RUN_DIR/pr.json — PR metadata (for force-push detection: re-fetch headRefOid via 'gh pr view ${PR} --json headRefOid -R ${REPO}' and compare to pr.json's value; abort with aborted=force-push if changed)
        - .pr-test.yml — base_url, per_test_timeout_seconds (default 60)

        Setup commands have already been run by the workflow before this stage, so DO NOT re-run them.

        For each test item, dispatch the pr-test-executor subagent via the Task tool. Pass the item JSON, base_url, and timeout. The subagent must return ONE result JSON per item.

        Output: write TestResults JSON to $RUN_DIR/test-results.json with the items array and summary counters. Reply with only a short status line." || exit 1
        validate_json "$RUN_DIR/test-results.json" validate_test_results || exit 1

        # Decide whether stage 4 should run
        FAIL_COUNT=$(python3 -c "import json; print(json.load(open('$RUN_DIR/test-results.json'))['summary']['fail'])")
        AUTO_FIX=$(python3 -c "import os, yaml; cfg = yaml.safe_load(open('.pr-test.yml')) if os.path.exists('.pr-test.yml') else {}; print('true' if (cfg or {}).get('auto_fix', True) else 'false')")
        if [[ "$FAIL_COUNT" -gt 0 && "$AUTO_FIX" == "true" ]]; then
          # Tolerant: if the fixer fails (timeout, can't produce a patch,
          # or returns non-zero for any reason), don't abort the pipeline
          # — we still want stage 5 to post a 'needs human review' report.
          # The report skill reads fix-pr-ref.json; null means no fix PR.
          if ! run_stage fix "Apply the fixing-test-failures skill.

        Inputs:
        - $RUN_DIR/test-results.json — has $FAIL_COUNT failed items
        - $RUN_DIR/change-map.json — hunks that the failed tests probed
        - PR head ref: $(jq -r .headRefName < "$RUN_DIR/pr.json")

        Output: write FixPRRef JSON to $RUN_DIR/fix-pr-ref.json (or 'null'). Open the fix PR via gh and capture its number/url/branch in the JSON. Reply with only a short status line."; then
            echo "::warning::Fix stage failed; downgrading to 'needs human review' and continuing to report"
            echo "null" > "$RUN_DIR/fix-pr-ref.json"
          fi
          # Defensive: if the fixer returned 0 but didn't write a valid
          # FixPRRef, also fall back to null so stage 5 can render.
          if ! validate_json "$RUN_DIR/fix-pr-ref.json" validate_fix_pr_ref 2>/dev/null; then
            echo "::warning::fix-pr-ref.json missing or invalid; treating as null"
            echo "null" > "$RUN_DIR/fix-pr-ref.json"
          fi
        else
          echo "[proctor:fix] skipped fail=$FAIL_COUNT auto_fix=$AUTO_FIX"
          echo "null" > "$RUN_DIR/fix-pr-ref.json"
        fi
        validate_json "$RUN_DIR/fix-pr-ref.json" validate_fix_pr_ref || exit 1

        # ---- Stage 5: report ----
        run_stage report "Apply the reporting-pr-test-results skill.

        Inputs:
        - $RUN_DIR/test-results.json
        - $RUN_DIR/fix-pr-ref.json (may be null)
        - $RUN_DIR/change-map.json

        Output: render the markdown report and post it as a PR comment via:
          gh pr comment $PR -R $REPO --body-file <path-to-rendered>
        Confirm posting succeeded by reading the comment back via 'gh pr view $PR -R $REPO --json comments'.

        Save the rendered markdown to $RUN_DIR/report.md as well so the artifact has it.

        Reply with only a short status line." || exit 1

        # All stages done — emit the COMPLETE marker
        echo "PROCTOR_PIPELINE_COMPLETE pr=$PR run_id=$RUN_ID" \
          | tee -a /tmp/proctor-stdout.log

    - name: Verify pipeline completed
      shell: bash
      run: |
        if grep -q "PROCTOR_PIPELINE_COMPLETE" /tmp/proctor-stdout.log 2>/dev/null; then
          echo "Pipeline marker found — all stages ran."
          exit 0
        fi
        echo "::error::PRoctor pipeline did not reach the COMPLETE marker." >&2
        if grep -q "PROCTOR_PIPELINE_FAILED" /tmp/proctor-stdout.log 2>/dev/null; then
          grep "PROCTOR_PIPELINE_FAILED" /tmp/proctor-stdout.log >&2
        fi
        exit 1

    - name: Sanitize run-id paths for artifact upload
      if: always()
      shell: bash
      run: |
        # GitHub artifacts reject : " < > | * ? \r \n in any path component.
        # The model is supposed to call runlog.make_run_id (which never
        # produces invalid chars), but if it improvises an ISO timestamp
        # in the run-id we'd lose the artifact. Rename defensively here.
        if [[ ! -d .proctor/runs ]]; then
          echo "No .proctor/runs to sanitize."
          exit 0
        fi
        cd .proctor/runs
        for d in */; do
          d="${d%/}"
          clean="$(echo -n "$d" | tr ':"<>|*?\r\n' '_')"
          if [[ "$d" != "$clean" ]]; then
            echo "Sanitizing run-id: $d -> $clean"
            mv -- "$d" "$clean"
          fi
        done

    - name: Upload run artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: proctor-run-${{ steps.resolve.outputs.pr }}
        path: .proctor/runs/
        if-no-files-found: warn
