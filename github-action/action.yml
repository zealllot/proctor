name: PRoctor
description: AI-driven PR test runner — analyze, plan, execute, fix, report.
inputs:
  anthropic-api-key:
    description: ANTHROPIC_API_KEY for Claude Code. Either this OR claude-code-oauth-token must be provided.
    required: false
  claude-code-oauth-token:
    description: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`. Use this when authenticating with a Claude.ai subscription instead of an Anthropic API key. Either this OR anthropic-api-key must be provided.
    required: false
  pr-number:
    description: PR number. Defaults to the event's PR number if available.
    required: false
runs:
  using: composite
  steps:
    # Anti-loop: PRoctor's auto-fix opens PRs named fix-<PR#>-<sha>.
    # If a workflow on that fix PR also triggers PRoctor, we'd recurse
    # (fix → analyzed → maybe fails → opens fix-of-fix → analyzed → ...).
    # Stop early: fix-* branches and PRs authored by github-actions[bot]
    # are PRoctor's own outputs, not subject matter for PRoctor itself.
    - name: Anti-loop guard
      id: antiloop
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "pull_request_target" ]]; then
          BR="${{ github.event.pull_request.head.ref }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"
          if [[ "$BR" == fix-*-* ]] || [[ "$AUTHOR" == "github-actions[bot]" ]] || [[ "$AUTHOR" == proctor-* ]]; then
            echo "::notice::Skipping PRoctor on fix PR (branch=$BR, author=$AUTHOR) to avoid loops."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Verify Claude auth provided
      if: steps.antiloop.outputs.skip != 'true'
      shell: bash
      run: |
        if [[ -z "${{ inputs.anthropic-api-key }}" && -z "${{ inputs.claude-code-oauth-token }}" ]]; then
          echo "ERR: PRoctor needs either 'anthropic-api-key' or 'claude-code-oauth-token' as an input. Neither was set." >&2
          echo "  - For an Anthropic API key, get one at https://console.anthropic.com" >&2
          echo "  - For a Claude.ai subscription, run 'claude setup-token' locally to generate an OAuth token." >&2
          exit 1
        fi

    - name: Checkout
      if: steps.antiloop.outputs.skip != 'true'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve PR number
      if: steps.antiloop.outputs.skip != 'true'
      id: resolve
      shell: bash
      run: |
        if [[ -n "${{ inputs.pr-number }}" ]]; then
          echo "pr=${{ inputs.pr-number }}" >> "$GITHUB_OUTPUT"
        elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
        elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
          echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
        else
          echo "no PR number" >&2; exit 1
        fi

    - name: Gate on issue_comment trigger
      id: comment-gate
      if: github.event_name == 'issue_comment'
      shell: bash
      run: |
        BODY=${{ toJSON(github.event.comment.body) }}
        # Trigger formats:
        #   /proctor run                   → resume after require_approval
        #   /proctor rerun [t-001 t-002]   → re-execute selected items only
        #                                    (no IDs = re-run all items)
        if [[ "$BODY" == *"/proctor rerun"* ]]; then
          MODE=rerun
          # Extract IDs after '/proctor rerun' on its line; tolerate trailing words
          IDS=$(echo "$BODY" | grep -oE '/proctor rerun[^\\n]*' | head -1 | sed 's|^/proctor rerun||' | tr -s ' \t' '\n' | grep -E '^t-[0-9]+$' | tr '\n' ' ')
          echo "mode=rerun" >> "$GITHUB_OUTPUT"
          echo "rerun_ids=$IDS" >> "$GITHUB_OUTPUT"
        elif [[ "$BODY" == *"/proctor run"* ]]; then
          MODE=run
          echo "mode=run" >> "$GITHUB_OUTPUT"
        else
          echo "Comment is not a PRoctor trigger; skipping."
          exit 78  # neutral exit
        fi
        # Require write access on the commenter
        gh api -H "Accept: application/vnd.github+json" \
          repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission \
          --jq '.permission' | grep -E '^(admin|write|maintain)$' \
          || { echo "commenter lacks write access"; exit 1; }
        echo "::notice::Trigger: $MODE${IDS:+ (IDs: $IDS)}"
      env:
        GH_TOKEN: ${{ github.token }}

    # Cache the Claude Code install so subsequent runs skip the
    # ~10s curl-and-install step. Bump CACHE_VERSION below to force a
    # re-download when Claude Code ships an update we want to pick up.
    - name: Cache Claude Code install
      if: steps.antiloop.outputs.skip != 'true'
      id: cache-claude
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/bin/claude
          ~/.local/share/anthropic-claude-code
          ~/.local/share/claude
        # GitHub evicts caches not accessed in 7 days, so a stable key is
        # fine. Bump the trailing "v1" if you need to force re-install.
        key: claude-code-${{ runner.os }}-${{ runner.arch }}-v1

    - name: Install Claude Code
      if: steps.cache-claude.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL https://claude.ai/install.sh | bash

    - name: Put Claude Code on PATH
      if: steps.antiloop.outputs.skip != 'true'
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run PRoctor (stage-by-stage)
      if: steps.antiloop.outputs.skip != 'true'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_ACTIONS: "true"
        PR: ${{ steps.resolve.outputs.pr }}
        REPO: ${{ github.repository }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        PROCTOR_MODE: ${{ steps.comment-gate.outputs.mode || 'run' }}
        PROCTOR_RERUN_IDS: ${{ steps.comment-gate.outputs.rerun_ids || '' }}
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/run-proctor.sh"

    - name: Verify pipeline completed
      if: steps.antiloop.outputs.skip != 'true'
      shell: bash
      run: |
        if grep -q "PROCTOR_PIPELINE_COMPLETE" /tmp/proctor-stdout.log 2>/dev/null; then
          echo "Pipeline marker found — all stages ran."
          exit 0
        fi
        echo "::error::PRoctor pipeline did not reach the COMPLETE marker." >&2
        if grep -q "PROCTOR_PIPELINE_FAILED" /tmp/proctor-stdout.log 2>/dev/null; then
          grep "PROCTOR_PIPELINE_FAILED" /tmp/proctor-stdout.log >&2
        fi
        exit 1

    - name: Sanitize run-id paths for artifact upload
      if: always()
      shell: bash
      run: |
        # GitHub artifacts reject : " < > | * ? \r \n in any path component.
        # The model is supposed to call runlog.make_run_id (which never
        # produces invalid chars), but if it improvises an ISO timestamp
        # in the run-id we'd lose the artifact. Rename defensively here.
        if [[ ! -d .proctor/runs ]]; then
          echo "No .proctor/runs to sanitize."
          exit 0
        fi
        cd .proctor/runs
        for d in */; do
          d="${d%/}"
          clean="$(echo -n "$d" | tr ':"<>|*?\r\n' '_')"
          if [[ "$d" != "$clean" ]]; then
            echo "Sanitizing run-id: $d -> $clean"
            mv -- "$d" "$clean"
          fi
        done

    - name: Upload run artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: proctor-run-${{ steps.resolve.outputs.pr }}
        path: .proctor/runs/
        if-no-files-found: warn
